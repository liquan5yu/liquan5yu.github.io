<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天涯论坛 · 成员社区</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234F46E5'/%3E%3Cpath d='M9 22V10h3.2l6 8.4V10H21v12h-3.2l-6-8.4V22H9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#F9FAFC;
  --ink:#1F2430;
  --ink-2:#5B6474;
  --ink-3:#98A1B3;
  --line:#E6E9F0;
  --line-2:#EDF0F5;
  --accent:#4F46E5;
  --accent-2:#4338CA;
  --accent-soft:#EEF0FE;
  --ok:#15803D;
  --ok-soft:#E7F6EC;
  --warn:#B45309;
  --warn-soft:#FBF0DC;
  --danger:#DC2626;
  --danger-soft:#FDEBEB;
  --side:#171B26;
  --side-ink:#C6CBD8;
  --side-line:#262C3B;
  --shadow:0 1px 2px rgba(23,27,38,.05),0 4px 16px rgba(23,27,38,.06);
  --radius:12px;
  --radius-sm:8px;
  --font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent);color:#fff}
[hidden]{display:none!important}

/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:background .15s,color .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:#FBDCDC}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.icon{width:18px;height:18px;flex:none;vertical-align:-3px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input,textarea.input,select.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:110px;line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.badge-cat{background:var(--accent-soft);color:var(--accent)}
.badge-admin{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;padding:1px 8px}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-off{background:#EEF0F5;color:var(--ink-3)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;font-weight:700;font-size:15px;color:#fff;flex:none;user-select:none}
.avatar.sm{width:30px;height:30px;font-size:12px;border-radius:8px}
.avatar.lg{width:46px;height:46px;font-size:18px;border-radius:12px}
.meta{color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#1F2430;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#B91C1C}
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty .icon{width:42px;height:42px;opacity:.4;margin-bottom:12px}
.empty p{font-size:14px}
.empty button{margin-top:14px}

/* ===== 登录页 ===== */
.login-wrap{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.login-brand{background:linear-gradient(160deg,#1F2430 0%,#232A3D 55%,#2B2F57 100%);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:52px 56px;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;right:-140px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(79,70,229,.35),transparent 70%)}
.login-brand::before{content:"";position:absolute;left:-80px;bottom:-160px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%)}
.brand-top{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;position:relative;z-index:1}
.brand-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff}
.brand-logo svg{width:22px;height:22px}
.brand-hero{position:relative;z-index:1;max-width:460px}
.brand-hero h1{font-size:40px;line-height:1.25;font-weight:800;letter-spacing:-.5px;margin-bottom:18px}
.brand-hero h1 span{background:linear-gradient(90deg,#818CF8,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-hero p{color:#AEB4C4;font-size:15px;line-height:1.8}
.brand-points{display:flex;gap:26px;position:relative;z-index:1}
.bp b{display:block;font-size:22px;font-weight:700}
.bp span{font-size:13px;color:#8A91A4}
.login-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{width:100%;max-width:400px}
.login-card .brand-logo{width:46px;height:46px;border-radius:12px;margin-bottom:22px}
.login-card h2{font-size:24px;font-weight:800;margin-bottom:6px}
.login-sub{color:var(--ink-2);font-size:14px;margin-bottom:28px}
.tab-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:24px}
.tab-switch button{flex:1;padding:8px 0;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink-2);transition:all .15s}
.tab-switch button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.login-hint{margin-top:20px;padding:12px 14px;background:var(--accent-soft);border:1px solid #DFE3FD;border-radius:10px;font-size:13px;color:var(--accent-2);line-height:1.7}
.login-hint b{font-weight:700}
.login-clock{margin-bottom:20px}
.login-clock .t{font-size:34px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1}
.login-clock .d{font-size:13px;color:var(--ink-3);margin-top:4px}
.login-notice{margin-bottom:16px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);border:1px solid #EAD9B5;color:var(--warn);font-size:13px;line-height:1.7}
.login-notice b{font-weight:700}
.login-block{padding:26px 20px;text-align:center;background:var(--surface-2);border-radius:12px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center}
.login-block p{color:var(--ink-2);font-size:14px;line-height:1.7;max-width:300px}

/* ===== 主布局 ===== */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px}
.top-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;cursor:pointer;flex:none}
.top-logo .brand-logo{width:30px;height:30px;border-radius:8px}
.top-logo .brand-logo svg{width:18px;height:18px}
.searchbox{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink-3)}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox input{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--ink)}
.searchbox svg{width:16px;height:16px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:10px;position:relative}
.user-chip-info{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:background .15s}
.user-chip-info:hover{background:var(--surface-2)}
.user-chip .uname{font-size:14px;font-weight:600;line-height:1.2}
.user-chip .urole{font-size:11px;color:var(--ink-3)}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:190px;padding:6px;z-index:80;transform-origin:top right;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.dropdown button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--ink);text-align:left}
.dropdown button:hover{background:var(--surface-2)}
.dropdown button.danger{color:var(--danger)}
.dropdown button svg{width:16px;height:16px;color:var(--ink-3)}
.dropdown button.danger svg{color:var(--danger)}
.dropdown .dd-head{padding:10px 12px 8px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.dropdown .dd-head b{display:block;font-size:14px}
.dropdown .dd-head span{font-size:12px;color:var(--ink-3)}
.dropdown hr{border:none;border-top:1px solid var(--line-2);margin:6px 0}

.layout{max-width:1100px;margin:0 auto;padding:26px 22px 80px;width:100%}

/* ===== 帖子列表 ===== */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.board-head h2{font-size:26px;font-weight:800;letter-spacing:-.3px}
.board-head .sub{color:var(--ink-2);font-size:14px;margin-top:4px}
.cat-filter{display:flex;gap:8px;flex-wrap:wrap}
.cat-filter button{padding:7px 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);transition:all .15s}
.cat-filter button:hover{border-color:var(--accent);color:var(--accent)}
.cat-filter button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.post-list{display:flex;flex-direction:column;gap:12px}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s cubic-bezier(.22,.8,.36,1)}
.post-card{transition:box-shadow .18s,transform .18s,border-color .18s;animation:pop .3s ease both}
.post-card:hover{border-color:#CFD6E6;box-shadow:var(--shadow);transform:translateY(-1px)}
.post-card .avatar{margin-top:2px}
.post-main{flex:1;min-width:0}
.post-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.post-title{font-size:16px;font-weight:700;color:var(--ink);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-excerpt{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.post-foot{display:flex;align-items:center;gap:14px;color:var(--ink-3);font-size:12.5px}
.post-foot .fi{display:inline-flex;align-items:center;gap:5px}
.post-foot .fi svg{width:14px;height:14px}
.pin-tag{color:var(--warn);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}

/* ===== 帖子详情 ===== */
.detail-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.detail-body{padding:30px 34px}
.detail-title{font-size:24px;font-weight:800;line-height:1.4;margin:14px 0 14px;letter-spacing:-.2px}
.detail-author{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line-2)}
.detail-author .nm{font-weight:600;font-size:15px}
.detail-author .at{display:flex;align-items:center;gap:7px;margin-top:2px}
.detail-content{font-size:15.5px;line-height:1.95;color:#2A3040;padding:22px 0;white-space:pre-wrap;word-break:break-word}
.detail-content a{color:var(--accent);text-decoration:underline}
.detail-actions{display:flex;align-items:center;gap:10px;padding-top:18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.like-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .15s;background:var(--surface)}
.like-btn:hover{border-color:var(--accent);color:var(--accent)}
.like-btn.liked{background:var(--accent-soft);border-color:#C7CCFB;color:var(--accent)}
.like-btn svg{width:16px;height:16px}
.comment-section{padding:24px 34px;border-top:1px solid var(--line-2)}
.comment-section h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.comment-section h3 .count{background:var(--surface-2);color:var(--ink-2);font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:600}
.comment-box{display:flex;gap:12px;margin-bottom:20px}
.comment-box .input{flex:1;min-height:0;padding:10px 13px}
.comment-box .avatar{margin-top:2px}
.comment-list{display:flex;flex-direction:column;gap:18px}
.comment{display:flex;gap:12px}
.comment .avatar{margin-top:2px}
.comment-main{flex:1;min-width:0;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.comment-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.comment-top .nm{font-weight:600;font-size:13.5px}
.comment-time{font-size:12px;color:var(--ink-3);margin-left:auto}
.comment-text{font-size:14px;line-height:1.7;color:#33394A;white-space:pre-wrap;word-break:break-word}
.detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;font-weight:600;margin-bottom:18px;cursor:pointer}
.detail-back:hover{color:var(--accent)}
.detail-back svg{width:16px;height:16px}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(23,27,38,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:540px;max-height:90dvh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.22);animation:pop .2s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line-2)}
.modal-head h3{font-size:17px;font-weight:800}
.modal-close{color:var(--ink-3);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surface-2);color:var(--ink)}
.modal-close svg{width:18px;height:18px}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px}
.check-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer}
.check-row:hover{background:var(--surface-2)}
.check-row .cr-info{flex:1}
.check-row .cr-info b{display:block;font-size:14px}
.check-row .cr-info span{font-size:12.5px;color:var(--ink-3)}
.ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s;flex:none}
.check-row.on .ck{background:var(--accent);border-color:var(--accent)}
.check-row.on .ck svg{display:block}
.ck svg{width:12px;height:12px;display:none}
.rolesel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolesel .check-row{margin-bottom:0}

/* ===== 管理后台 ===== */
.admin{display:flex;min-height:calc(100dvh - 60px)}
.admin-side{width:232px;background:var(--side);color:var(--side-ink);flex:none;padding:22px 14px;position:sticky;top:60px;height:calc(100dvh - 60px);overflow:auto;display:flex;flex-direction:column}
.admin-side .as-title{display:flex;align-items:center;gap:10px;font-weight:700;color:#fff;font-size:15px;padding:0 10px;margin-bottom:22px}
.admin-side .as-title .brand-logo{width:28px;height:28px;border-radius:7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--side-ink);cursor:pointer;transition:all .15s;margin-bottom:2px}
.nav-item svg{width:17px;height:17px;flex:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.admin-side .as-divider{margin:14px 10px;border:none;border-top:1px solid var(--side-line)}
.admin-side .as-foot{margin-top:auto;padding-top:16px}
.admin-main{flex:1;min-width:0;padding:30px 34px;background:var(--bg)}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.admin-head h2{font-size:23px;font-weight:800;letter-spacing:-.3px}
.admin-head .sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.stat-card .sc-label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.stat-card .sc-label svg{width:15px;height:15px;color:var(--accent)}
.stat-card .sc-val{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.stat-card .sc-note{font-size:12px;color:var(--ink-3);margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-head h3{font-size:15px;font-weight:700}
.panel-head .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:720px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:11px 20px;border-bottom:1px solid var(--line-2);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:13px 20px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .cell-user{display:flex;align-items:center;gap:11px}
.tbl .cell-user .un{font-weight:600}
.tbl .cell-user .unm{font-size:12px;color:var(--ink-3)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);transition:all .12s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn svg{width:16px;height:16px}
.btn-mini{padding:5px 11px;font-size:12.5px;border-radius:7px;font-weight:600;border:1px solid var(--line);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.btn-mini:hover{background:var(--surface-2);color:var(--ink)}
.btn-mini.danger{color:var(--danger);border-color:#F3CCCC}
.btn-mini.danger:hover{background:var(--danger-soft)}
.btn-mini.warn{color:var(--warn);border-color:#EAD9B5}
.btn-mini.warn:hover{background:var(--warn-soft)}
.btn-mini svg{width:13px;height:13px}
.pager{display:flex;align-items:center;gap:8px;padding:14px 20px;justify-content:center}
.pager button{min-width:32px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.pager button:hover{border-color:var(--accent);color:var(--accent)}
.pager button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.mobile-side{display:none}
.drawer-backdrop{display:none}
@media (max-width:900px){
  .drawer-backdrop{display:block;position:fixed;inset:0;background:rgba(23,27,38,.45);z-index:85;animation:fade .2s ease}
}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:none}
.set-row b{font-size:14px;display:block}
.set-row p{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.6}
.switch{width:46px;height:26px;border-radius:999px;background:#D7DBE4;position:relative;cursor:pointer;transition:background .18s;flex:none}
.switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on span{transform:translateX(20px)}

/* ===== 我的页面 ===== */
.my-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}
.my-tabs button{padding:11px 16px;font-size:14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.my-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.profile-top{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:24px;flex-wrap:wrap}
.profile-top .pt-info b{font-size:20px;font-weight:800;display:block}
.profile-top .pt-info span{font-size:13px;color:var(--ink-2)}
.profile-top .pt-right{margin-left:auto;display:flex;gap:24px;text-align:center}
.profile-top .pt-right .pr b{display:block;font-size:20px;font-weight:800}
.profile-top .pt-right .pr span{font-size:12px;color:var(--ink-3)}

/* ===== 响应式 ===== */
@media (max-width:900px){
  .login-wrap{grid-template-columns:1fr}
  .login-brand{display:none}

}

<script>
/* ============================================================
   天涯论坛 · 前端演示实现
   数据全部保存在浏览器 localStorage，无真实后端。
   ============================================================ */
const LS_DATA='tianya_forum_data_v2';
const LS_SESSION='tianya_forum_session_v2';
const CATS=['闲聊','求助','经验','公告','技术'];
const PALETTE=['#4F46E5','#0E7490','#B45309','#15803D','#BE185D','#7C3AED','#B91C1C','#0369A1'];

const AVATAR_BG=(u)=>{let h=0;for(let i=0;i<u.length;i++)h=(h*31+u.charCodeAt(i))%PALETTE.length;return PALETTE[h];};
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function seed(){
  return { users:[], posts:[], settings:{loginOpen:true,maintenance:false,loginNotice:''} };
}
function normSettings(d){
  d.settings=Object.assign({loginOpen:true,maintenance:false,loginNotice:''},d.settings||{});
  d.users.forEach(u=>{u.nick=u.nick||'';u.bio=u.bio||'';u.isFounder=!!u.isFounder;});
  if(d.users.length&&!d.users.some(u=>u.isFounder)){
    const found=d.users.find(u=>u.role==='admin')||d.users[0];
    if(found)found.isFounder=true;
  }
}

/* ===== 数据层 ===== */
function loadData(){try{const d=JSON.parse(localStorage.getItem(LS_DATA));if(d&&d.users&&d.posts){normSettings(d);return d;}}catch(e){}const s=seed();saveData(s);return s;}
function saveData(d){localStorage.setItem(LS_DATA,JSON.stringify(d));}
let DB=loadData();
function saveDB(){saveData(DB);}
function uid(){return 'x'+Date.now().toString(36)+Math.floor(Math.random()*9999);}
function nowISO(){return new Date().toISOString();}
function dayOffset(days,hours){const t=new Date();t.setDate(t.getDate()-days);t.setHours(t.getHours()-hours);return t.toISOString();}

/* 会话 */
let SESSION=null;
function loadSession(){const s=localStorage.getItem(LS_SESSION);if(s){const u=DB.users.find(x=>x.id===s);if(u&&!u.disabled)SESSION=u;else localStorage.removeItem(LS_SESSION);}}
function setSession(id){SESSION=DB.users.find(x=>x.id===id);localStorage.setItem(LS_SESSION,id);}
function clearSession(){SESSION=null;localStorage.removeItem(LS_SESSION);}
function isAdmin(){return SESSION&&SESSION.role==='admin';}

/* ===== 时间格式化 ===== */
function fmtTime(iso){
  if(!iso)return '';
  const d=new Date(iso),now=new Date();
  const diff=Math.max(0,now-d);
  const min=Math.floor(diff/60000);
  if(min<1)return '刚刚';
  if(min<60)return min+' 分钟前';
  const hr=Math.floor(min/60);
  if(hr<24)return hr+' 小时前';
  const days=Math.floor(hr/24);
  if(days===1)return '昨天';
  if(days<7)return days+' 天前';
  const sameYear=d.getFullYear()===now.getFullYear();
  const p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}月${d.getDate()}日`+(sameYear?'':` ${d.getFullYear()}`)+` ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtFull(iso){if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}

  openModal('confirm-modal');
}

/* 根据是否已有管理员决定显示「注册管理员」还是「登录」 */

  const u=document.getElementById('setup-user').value.trim();
  const p=document.getElementById('setup-pass').value;
  const p2=document.getElementById('setup-pass2').value;
  if(u.length<2){toast('管理员账号至少 2 个字符',true);return;}
  if(p.length<4){toast('密码至少 4 位',true);return;}
  if(p!==p2){toast('两次输入的密码不一致',true);return;}
  const id=uid();
  DB.users.push({id,username:u,password:p,role:'admin',createdAt:nowISO(),disabled:false,nick:'',bio:'',isFounder:true});

function login(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  if(!u||!p){toast('请输入账号和密码',true);return;}
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  if(!user){toast('账号或密码错误',true);return;}
  if(user.disabled){toast('该账号已被禁用，请联系管理员',true);return;}
  if(loginMode==='admin' && user.role!=='admin'){toast('该账号不是管理员，请切换到成员登录',true);return;}

                  ${isAdmin()?`<button class="btn-mini warn" onclick="toggleCommentHidden('${p.id}','${c.id}')">${c.hidden?'取消屏蔽':'屏蔽'}</button>`:''}
                  ${cDel?`<button class="btn-mini danger" onclick="deleteComment('${p.id}','${c.id}')">删除</button>`:''}
                </div>
              </div>
            </div>`;
          }).join(''):`<div class="empty" style="padding:34px 0"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>还没有评论，来说点什么吧</p></div>`}
        </div>
      </div>
    </div>`;
}
function addComment(){
  const p=DB.posts.find(x=>x.id===detailId);if(!p)return;
  const el=document.getElementById('new-comment');
  const v=el.value.trim();
  if(!v){toast('评论不能为空',true);return;}
  p.comments.push({id:uid(),authorId:SESSION.id,content:v,createdAt:nowISO()});
  saveDB();renderDetail();
}
function likePost(id){
  const p=DB.posts.find(x=>x.id===id);if(!p)return;
  const i=p.likedBy.indexOf(SESSION.id);
  if(i>-1)p.likedBy.splice(i,1);else p.likedBy.push(SESSION.id);
  saveDB();renderDetail();
}
function deletePost(id){
  openConfirm('删除帖子','删除后无法恢复，确定删除这篇帖子吗？',()=>{
    DB.posts=DB.posts.filter(x=>x.id!==id);saveDB();
    toast('帖子已删除');go('board');
  });
}
function togglePostHidden(id){
  const p=DB.posts.find(x=>x.id===id);if(!p)return;
  p.hidden=!p.hidden;saveDB();
  toast(p.hidden?'已屏蔽，普通用户将看不到该帖子':'已取消屏蔽');
  if(!document.getElementById('view-detail').hidden){renderDetail();}else{renderAdminPosts();}
}
function toggleCommentHidden(pid,cid){
  const p=DB.posts.find(x=>x.id===pid);if(!p)return;
  const c=p.comments.find(x=>x.id===cid);if(!c)return;
  c.hidden=!c.hidden;saveDB();
  toast(c.hidden?'已屏蔽该评论':'已取消屏蔽');renderDetail();
}
function deleteComment(pid,cid){
  openConfirm('删除评论','确定删除这条评论吗？',()=>{
    const p=DB.posts.find(x=>x.id===pid);
    if(p){p.comments=p.comments.filter(c=>c.id!==cid);saveDB();renderDetail();}
  });
}

/* ===== 发帖 ===== */
function openPostModal(){
  if(!SESSION)return;
  const sel=document.getElementById('post-cat');
  sel.innerHTML=CATS.map(c=>`<option value="${c}">${esc(c)}</option>`).join('');
  document.getElementById('post-title').value='';
  document.getElementById('post-content').value='';
  sel.value='闲聊';
  openModal('post-modal');
}
function submitPost(){
  const t=document.getElementById('post-title').value.trim();
  const c=document.getElementById('post-content').value.trim();

let editingUserId=null;
function openUserModal(id){
  editingUserId=id||null;
  const u=id?DB.users.find(x=>x.id===id):null;
  document.getElementById('um-title').textContent=u?`编辑成员 · ${u.username}`:'新建成员';
  document.getElementById('um-user').value=u?u.username:'';
  document.getElementById('um-pass').value=u?u.password:'';
  document.getElementById('um-pass').placeholder=u?'（原密码 '+u.password+'）':'设置初始密码';
  document.querySelectorAll('.rolesel .check-row').forEach(r=>r.classList.toggle('on',r.dataset.v===(u?u.role:'user')));
  openModal('user-modal');
}
function pickRole(v){document.querySelectorAll('.rolesel .check-row').forEach(r=>r.classList.toggle('on',r.dataset.v===v));}
function saveUser(){
  const u=document.getElementById('um-user').value.trim();
  const p=document.getElementById('um-pass').value.trim();
  const role=document.querySelector('.rolesel .check-row.on').dataset.v;
  if(!u){toast('请填写账号名',true);return;}
  if(editingUserId){
    const t=DB.users.find(x=>x.id===editingUserId);
    if(DB.users.some(x=>x.username===u&&x.id!==editingUserId)){toast('该账号名已存在',true);return;}
    t.username=u;t.role=role;
    if(p)t.password=p;
    saveDB();closeModal('user-modal');renderUsers();toast('已保存修改');
  }else{
    if(DB.users.some(x=>x.username===u)){toast('该账号名已存在',true);return;}
    if(!p){toast('请为新成员设置初始密码',true);return;}
    DB.users.push({id:uid(),username:u,password:p,role,createdAt:nowISO(),disabled:false});
    saveDB();closeModal('user-modal');renderUsers();toast(`已创建成员 ${u}，初始密码 ${p}`);
  }
}
function toggleUser(id){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  u.disabled=!u.disabled;saveDB();renderUsers();
  toast(u.disabled?`已禁用 ${u.username}`:`已启用 ${u.username}`);
}
function resetPass(id){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  openConfirm('重置密码',`将 ${u.username} 的密码重置为 “123456”，确定吗？`,()=>{
    u.password='123456';saveDB();renderUsers();toast(`已重置 ${u.username} 的密码为 123456`);
  });
}
function delUser(id){
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  if(u.role==='admin'&&DB.users.filter(x=>x.role==='admin').length<=1){toast('至少保留一名管理员',true);return;}
  openConfirm('删除成员',`将删除成员 ${u.username}，其帖子与评论会保留但显示为“已注销用户”。确定吗？`,()=>{
    DB.users=DB.users.filter(x=>x.id!==id);saveDB();renderUsers();toast('已删除成员');
  });
}

          <tbody>
          ${list.map(p=>`<tr>
            <td><div style="font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;${p.hidden?'color:var(--ink-3)':''}" onclick="openDetail('${p.id}')">${esc(p.title)}</div></td>
            <td>${esc(dispName(p.authorId))}</td>
            <td><span class="badge badge-cat">${esc(p.category)}</span></td>
            <td>${p.hidden?'<span class="badge badge-off">已屏蔽</span>':'<span class="badge badge-ok">正常</span>'}</td>
            <td style="color:var(--ink-3);font-size:13px">${fmtTime(p.createdAt)}</td>
            <td>${p.comments.filter(c=>!c.hidden).length}${p.comments.some(c=>c.hidden)?'（+'+p.comments.filter(c=>c.hidden).length+' 屏）':''}</td>
            <td><div class="row-actions">
              <button class="btn-mini ${p.hidden?'':'warn'}" onclick="togglePostHidden('${p.id}')">${p.hidden?'取消屏蔽':'屏蔽'}</button>
              <button class="btn-mini danger" onclick="deletePost('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除</button>
            </div></td>
          </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${!list.length?'<div class="empty" style="padding:40px"><p>没有匹配的帖子</p></div>':''}
    </div>`;
}

/* ===== 站点设置 ===== */
function renderSettings(){
  const s=DB.settings;
  document.getElementById('admin-settings').innerHTML=`
    <div class="admin-head"><div><h2>站点设置</h2><p class="sub">控制登录权限、关站维护与登录页公告</p></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:920px">
      <div class="panel">
        <div class="panel-head"><h3>访问开关</h3></div>
        <div style="padding:4px 20px">
          <div class="set-row">
            <div><b>允许成员登录</b><p>关闭后普通成员无法登录，管理员仍可正常进入后台。</p></div>
            <span class="switch ${s.loginOpen?'on':''}" onclick="toggleSetting('loginOpen')"><span></span></span>
          </div>
          <div class="set-row">
            <div><b>关站维护模式</b><p>开启后登录页显示「网站维护中」，普通成员暂时无法登录。</p></div>
            <span class="switch ${s.maintenance?'on':''}" onclick="toggleSetting('maintenance')"><span></span></span>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>登录页公告</h3></div>
        <div style="padding:18px 20px">
          <textarea class="input" id="set-notice" rows="4" placeholder="写给登录成员的公告，留空则不显示">${esc(s.loginNotice)}</textarea>
          <button class="btn btn-primary" style="margin-top:12px" onclick="saveNotice()">保存公告</button>
        </div>
      </div>
    </div>`;
}
function toggleSetting(k){
  DB.settings[k]=!DB.settings[k];saveDB();renderSettings();
  toast(DB.settings[k]?'已开启':'已关闭');
}
function saveNotice(){
  DB.settings.loginNotice=document.getElementById('set-notice').value.trim();
  saveDB();toast('公告已保存');
}

/* ===== 初始化 ===== */
function init(){
  loadSession();
  refreshLoginStats();
  renderLoginMode();
  document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();login();});
  document.getElementById('setup-form').addEventListener('submit',e=>{e.preventDefault();doSetup();});
  tickClock();setInterval(tickClock,1000);
  renderCats();
  if(SESSION)afterLogin();else show('view-login');
}
init();
</script>
</body>
</html>
