      '<span class="hint">请先把「示例用户名」替换为已存在的学生用户名。</span></div>',
    onOpen(root){ root.querySelector('#imp-tpl').onclick=()=>{ root.querySelector('#imp').value=tpl; }; },
    onOk(root){
      const text=root.querySelector('#imp').value;
      if(!text.trim()){ toast('请先粘贴内容','err'); return false; }
      result=parseImportScores(text); renderAdminScores(); return true;
    }
  }).then(ok=>{ if(ok&&result)showImportResult('成绩导入结果',result.added,result.errors); });
}
function parseImportScores(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const added=[],errors=[];
  lines.forEach((line,i)=>{
    if(/^(#|\/\/)/.test(line))return;
    const p=line.split(/[,，\t]/).map(s=>s.trim());
    if(i===0&&p[0]==='学生用户名')return;
    if(p.length<12){ errors.push('第'+(i+1)+'行：需要 12 列'); return; }
    const stu=DB.students.find(s=>s.username===p[0]);
    if(!stu){ errors.push('第'+(i+1)+'行：找不到学生 '+p[0]); return; }
    if(!canEditStudent(stu)){ errors.push('第'+(i+1)+'行：权限不足，'+stu.name+' 不在可管理范围'); return; }
    const exam=p[1],date=p[2];
    if(!exam){ errors.push('第'+(i+1)+'行：考试名称为空'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ errors.push('第'+(i+1)+'行：日期需为 YYYY-MM-DD'); return; }
    const scores={};let bad=false;
    SUBJECTS.forEach((sub,k)=>{
      const r=parseScore(p[3+k],sub);
      if(!r.ok){ bad=true;errors.push('第'+(i+1)+'行 '+sub+'：'+r.msg); }
      else if(r.value!==null)scores[sub]=r.value;
    });
    if(bad)return;
    if(!Object.keys(scores).length){ errors.push('第'+(i+1)+'行：未录入任何科目'); return; }
    const allowed=allowedSubjects(stu);
    const extra=SUBJECTS.filter(sub=>!allowed.includes(sub)&&typeof scores[sub]==='number');
    if(extra.length){ errors.push('第'+(i+1)+'行：'+stu.name+' 选科为'+comboName(stu)+'，不能录入 '+extra.join('、')); return; }
    if(DB.scores.some(r=>r.studentId===stu.id&&r.exam===exam&&r.date===date)){
      errors.push('第'+(i+1)+'行：'+stu.name+' 的「'+exam+' '+date+'」已存在，跳过'); return; }
    added.push({id:uid(),studentId:stu.id,exam,date,scores,total:totalOf(scores),createdAt:Date.now()});
  });
  DB.scores.push(...added); save('scores');
  return {added:added.length,errors};
}
function showImportResult(title,n,errors){
  openModal({
    title,hideOk:true,cancelText:'关闭',width:560,
    body:'<p class="confirm-text">成功导入 <b>'+n+'</b> 条'+
      (errors.length?'，跳过/失败 <b>'+errors.length+'</b> 处：':'，无错误。')+'</p>'+
      (errors.length?'<pre class="log">'+esc(errors.join('\n'))+'</pre>':'')
  });
}

/* ---------- ⑦ 离线降级折线图（无 CDN 时自动启用，纯 Canvas 本地绘制） ---------- */
function drawFallbackChart(canvas,labels,values){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth||600,h=canvas.clientHeight||300;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  const pad={l:48,r:18,t:22,b:46},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  let mn=Math.min.apply(null,values),mx=Math.max.apply(null,values);
  const span=mx-mn||100;mn=Math.max(0,mn-span*.15);mx=mx+span*.15;
  const X=i=>pad.l+(values.length===1?iw/2:iw*i/(values.length-1));
  const Y=v=>pad.t+ih-(v-mn)/(mx-mn)*ih;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#e2e8f0';ctx.lineWidth=1;ctx.fillStyle='#64748b';ctx.font='11px sans-serif';
  for(let k=0;k<=4;k++){
    const y=pad.t+ih*k/4,v=mx-(mx-mn)*k/4;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.textAlign='right';ctx.fillText(Math.round(v),pad.l-7,y+4);
  }
  ctx.beginPath();ctx.moveTo(X(0),Y(values[0]));
  values.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.lineTo(X(values.length-1),pad.t+ih);ctx.lineTo(X(0),pad.t+ih);ctx.closePath();
  ctx.fillStyle='rgba(30,58,138,.10)';ctx.fill();
  ctx.beginPath();ctx.moveTo(X(0),Y(values[0]));
  values.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.strokeStyle='#1e3a8a';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  values.forEach((v,i)=>{
    ctx.beginPath();ctx.arc(X(i),Y(v),4,0,Math.PI*2);
    ctx.fillStyle='#1e3a8a';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#1f2937';ctx.textAlign='center';ctx.font='bold 11px sans-serif';
    ctx.fillText(fmtNum(v),X(i),Y(v)-10);
  });
  const step=Math.ceil(labels.length/Math.max(1,Math.floor(iw/70)));
  labels.forEach((lb,i)=>{
    if(i%step!==0&&i!==labels.length-1)return;
    ctx.fillStyle='#64748b';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(lb,X(i),h-pad.b+18);
  });
  ctx.fillStyle='#1e3a8a';ctx.textAlign='left';ctx.font='bold 12px sans-serif';
  ctx.fillText('总分趋势（离线内置绘图）',pad.l,14);
}

/* ---------- ⑧ 启动与数据迁移 ---------- */
/** 兼容旧版数据：为老学生补 classId / combo，按 className 自动建班级与年级 */
function migrate(){
  // 旧版本没有「考试预告 / 作弊记录」键：初始化为空数组，避免读取时报错
  if(!Array.isArray(DB.examNotices)) DB.examNotices=[];
  if(!Array.isArray(DB.cheating)) DB.cheating=[];
  DB.students.forEach(s=>{
    if(!Array.isArray(s.combo)) s.combo=[];
    if(!Array.isArray(s.honors)) s.honors=[];   // 职称与奖项
    if(s.classId===undefined){
      const old=s.className&&s.className!==UNCLASSIFIED?s.className:null;
      if(old){
        // 优先按完整标签匹配，再按「名称 + 年级」匹配，避免跨年级同名班级误合并
        let c=DB.classes.find(x=>classLabel(x)===old)||
              DB.classes.find(x=>x.name===old&&(!s.grade||x.grade===s.grade));
        if(!c){ c={id:uid(),name:old,grade:s.grade||NO_GRADE};DB.classes.push(c); }
        s.classId=c.id;
        if(!DB.grades.includes(c.grade))DB.grades.push(c.grade);
      }else s.classId=null;
    }
  });
  // 旧管理人员补职务与联系方式结构：旧 leader → 学校领导（通用），head → 班主任
  DB.staff.forEach(s=>{
    if(!s.title) s.title=s.role==='head'?'班主任':'学校领导';
    if(!s.contact||typeof s.contact!=='object') s.contact={};
    if(!Array.isArray(s.contact.extra)) s.contact.extra=[];
  });
  // 旧成绩中选考科目若超过 100 分，仅做展示兼容、不改写数据
  // 统一落盘一次：既保存迁移结果，也为新增的 staff/grades/classes/comments/公告 建立键
  ['students','staff','grades','classes','scores','comments','announcements',
   'messages','gradeRequests','examNotices','cheating'].forEach(k=>save(k));
  if(!DB.annRead||typeof DB.annRead!=='object') DB.annRead={};
  save('annRead');
  if(!DB.settings||typeof DB.settings!=='object') DB.settings={};
  if(typeof DB.settings.headOtherComboFirst!=='boolean') DB.settings.headOtherComboFirst=false;
  save('settings');
  if(DB.admin) save('admin');
}
migrate();
route();
</script>
