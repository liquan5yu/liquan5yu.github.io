<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂林市第三中学成绩管理系统</title>
<!--
  按要求引入 Chart.js（CDN）用于总分趋势折线图。
  系统业务数据 100% 存于 LocalStorage，不使用 fetch / XHR / WebSocket / 表单提交，
  不上传任何数据；若离线导致 CDN 未加载，会自动降级为内置 Canvas 绘图，功能不受影响。
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============ 基础变量：深蓝主色 + 浅灰辅助 + 深色文字 ============ */
:root{
  --navy:#1e3a8a; --navy-dark:#16307a; --navy-light:#e8eefc;
  --gray:#f1f5f9; --gray-2:#e2e8f0; --line:#dbe3ee;
  --text:#1f2937; --muted:#64748b; --white:#fff;
  --danger:#dc2626; --danger-bg:#fef2f2; --ok:#0f766e; --ok-bg:#f0fdfa;
  --warn:#b45309; --warn-bg:#fffbeb; --purple:#6d28d9; --purple-bg:#f5f3ff;
  --radius:12px; --shadow:0 4px 18px rgba(20,40,90,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--gray); color:var(--text); font-size:14px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
a{color:var(--navy);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:14px}
/* ============ 通用组件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border:1px solid transparent;border-radius:8px;cursor:pointer;
  background:var(--gray-2);color:var(--text);font-weight:600;transition:.15s;white-space:nowrap;
}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-dark)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:13px;font-weight:500}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .tag{font-size:12px;font-weight:500;color:var(--muted);background:var(--gray);padding:2px 8px;border-radius:20px}
.card h3{font-size:15px;margin:18px 0 10px;color:var(--navy-dark);border-left:3px solid var(--navy);padding-left:9px}
.card h3:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,input.inp,select.inp,textarea.inp{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--text);outline:none;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus,input.inp:focus,select.inp:focus,textarea.inp:focus{
  border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,58,138,.12)
}
.field input.invalid,input.inp.invalid{border-color:var(--danger);background:var(--danger-bg)}
textarea.inp{resize:vertical;min-height:120px;line-height:1.7}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:20px;font-weight:600}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge.admin{background:var(--navy-light);color:var(--navy-dark)}
.badge.leader{background:var(--purple-bg);color:var(--purple)}
.badge.head{background:#ecfeff;color:#0e7490}
.badge.student{background:var(--ok-bg);color:var(--ok)}
.badge.soft{background:var(--gray);color:var(--muted)}
.badge.gold{background:#fef3c7;color:#92400e}
.chk-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.chk{display:inline-flex;align-items:center;gap:5px;background:var(--gray);border:1px solid var(--line);
  padding:6px 10px;border-radius:20px;cursor:pointer;font-size:13px;user-select:none}
.chk input{width:auto;margin:0;accent-color:var(--navy)}
.chk.on{background:var(--navy-light);border-color:#b9cdf7;color:var(--navy-dark);font-weight:700}
/* ============ 登录 / 初始化 独立页 ============ */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(150deg,#e8eefc 0%,#f1f5f9 55%,#e2e8f0 100%)}
.auth-card{width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(20,40,90,.14);padding:30px 26px}
.auth-card .logo-big{width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:14px}
.auth-card h1{font-size:21px}
.auth-card .sub{color:var(--muted);font-size:13px;margin:6px 0 22px}
.auth-card .field{margin-bottom:14px}
.auth-card .btn{margin-top:8px}
.auth-foot{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
/* ============ 顶部导航 + 面包屑 ============ */
.topbar{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;
  gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(16,32,80,.25)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800}
.brand strong{display:block;font-size:15px;letter-spacing:.3px}
.brand small{display:block;font-size:11px;opacity:.72}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:rgba(255,255,255,.82);padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.nav a.active{background:#fff;color:var(--navy)}
.userbox{display:flex;align-items:center;gap:9px;font-size:13px}
.userbox .btn.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.wrap{max-width:1220px;margin:0 auto;padding:18px 20px 40px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:12px}
.crumb b{color:var(--navy)}
.notice{background:var(--warn-bg);border:1px solid #fde68a;color:var(--warn);
  padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:16px}
.pagehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:22px;color:var(--navy-dark)}
.pagehead .sub{color:var(--muted);font-size:13px}
footer.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px 0;border-top:1px solid var(--line);margin-top:10px}
/* ============ 表格 ============ */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:collapse;min-width:620px;background:#fff}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{background:var(--gray);color:var(--muted);font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafc}
td .ops{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
/* ============ 统计 / 概览小卡 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:800;color:var(--navy);margin-top:4px}
.stat .v.small{font-size:16px}
.total-box{background:var(--navy-light);border:1px solid #c7d7f7;border-radius:10px;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.total-box b{font-size:24px;color:var(--navy-dark)}
.hero-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.hero{background:linear-gradient(135deg,#1e3a8a,#2d55b8);color:#fff;border-radius:var(--radius);padding:18px}
.hero.alt{background:linear-gradient(135deg,#0f766e,#0e7490)}
.hero .k{font-size:12px;opacity:.82}
.hero .n{font-size:24px;font-weight:800;margin:6px 0 2px}
.hero .m{font-size:12px;opacity:.85;line-height:1.7}
/* ============ 学生端成绩卡片 ============ */
.exam-card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:14px;overflow:hidden}
.exam-head{background:var(--navy-light);padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap}
.exam-head .t{font-weight:800;color:var(--navy-dark);font-size:15px}
.exam-head .d{font-size:12px;color:var(--muted)}
.exam-body{padding:14px 16px}
.subj-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.subj{background:var(--gray);border-radius:8px;padding:8px;text-align:center}
.subj .n{font-size:12px;color:var(--muted)}
.subj .s{font-size:17px;font-weight:800;color:var(--text)}
.subj .s.none{color:#94a3b8;font-weight:500}
.exam-foot{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.exam-foot b{color:var(--navy)}
.first-line{margin-top:10px;padding:9px 12px;background:#fffbeb;border:1px solid #fde68a;
  border-radius:8px;font-size:13px;color:#92400e;display:flex;gap:14px;flex-wrap:wrap}
.first-line b{color:#78350f}
.comment{margin-top:10px;border-left:3px solid var(--purple);background:var(--purple-bg);
  border-radius:0 8px 8px 0;padding:10px 12px;font-size:13px}
.comment .who{font-size:12px;color:var(--purple);font-weight:700;margin-bottom:3px}
.comment .txt{white-space:pre-wrap;color:var(--text)}
/* ============ 班级管理人员信息 ============ */
.mgr-box{margin-top:12px;background:var(--navy-light);border:1px solid #c7d7f7;
  border-radius:9px;padding:10px 13px;font-size:13px;color:var(--navy-dark);line-height:1.9}
.mgr-box b{color:var(--text)}
.mgr-cell{font-size:12px;line-height:1.7;white-space:normal;min-width:150px}
.mgr-cell span{color:var(--muted)}
.mgr-contact{font-size:12px;color:var(--navy-dark);margin-top:2px;padding-left:14px;border-left:2px solid #c7d7f7}
.mgr-contact span{color:var(--muted)}
.notice-line{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.notice-line:last-child{border-bottom:none}
/* ============ 工作台实时时钟 ============ */
.clock-card{background:linear-gradient(135deg,#1e3a8a,#2d55b8);color:#fff;border-radius:var(--radius);
  padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.clock-card .c-left{display:flex;flex-direction:column;gap:2px}
.clock-card .c-time{font-size:30px;font-weight:800;letter-spacing:2px;line-height:1.2;font-variant-numeric:tabular-nums}
.clock-card .c-date{font-size:13px;opacity:.9}
.clock-card .c-right{font-size:13px;text-align:right;line-height:1.9;opacity:.95}
.clock-card .c-right b{font-size:16px}
.userbox .clock-chip{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.3;
  background:rgba(255,255,255,.12);border-radius:7px;padding:4px 9px;font-variant-numeric:tabular-nums}
.userbox .clock-chip b{font-size:13px}
.userbox .clock-chip small{font-size:10px;opacity:.8}
/* ============ 考试预告 ============ */
.en-item{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:10px;background:#fff}
.en-item.upcoming{background:var(--navy-light);border-color:#c7d7f7}
.en-item.past{opacity:.62}
.en-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.en-head b{font-size:15px;color:var(--navy-dark)}
.en-meta{font-size:13px;color:var(--text);line-height:1.9}
.en-count{font-size:12px;color:var(--navy-dark);font-weight:700;background:#fff;border:1px solid #c7d7f7;
  padding:2px 9px;border-radius:20px}
/* ============ 作弊记录警示 ============ */
.cheat-alert{border:2px solid var(--danger);background:var(--danger-bg);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.cheat-alert h2{color:var(--danger);font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cheat-alert .cheat-row{border-top:1px dashed #fca5a5;padding:8px 0;font-size:13px;line-height:1.8}
.cheat-alert .cheat-row:first-of-type{border-top:none}
.badge.cheat{background:var(--danger);color:#fff}
.cheat-note{margin-top:10px;padding:9px 12px;background:#fff;border:1px solid var(--danger);
  border-radius:8px;color:var(--danger);font-size:13px;font-weight:700}
/* ============ 公告 ============ */
.ann-item{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:10px;background:#fff}
.ann-item.force{background:var(--warn-bg);border-color:#fde68a}
.ann-item:last-child{margin-bottom:0}
.ann-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.ann-head b{font-size:14px;color:var(--navy-dark)}
.ann-head .hint{margin-left:auto}
.ann-body{font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.8}
.chartbox{position:relative;height:320px;width:100%}
.chartbox canvas{width:100%!important;height:100%!important}
/* ============ 弹窗 / Toast / 404 ============ */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:100}
.dialog{background:#fff;border-radius:14px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);
  max-height:88vh;display:flex;flex-direction:column}
.dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dlg-head h3{font-size:16px}
.dlg-head .x{border:none;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer}
.dlg-body{padding:18px 20px;overflow:auto}
.dlg-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.confirm-text{font-size:14px;line-height:1.8;margin:0}
.confirm-text b{color:var(--danger)}
pre.log{background:var(--gray);border:1px solid var(--line);border-radius:8px;padding:12px;
  font-size:12px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:10px 0 0}
#toastRoot{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.toast{background:var(--navy-dark);color:#fff;padding:10px 16px;border-radius:9px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px;animation:tin .2s ease;max-width:100%}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.page404{text-align:center;padding:70px 20px}
.page404 .code{font-size:78px;font-weight:900;color:var(--navy);opacity:.22;line-height:1}
/* ============ 响应式：手机适配 ============ */
@media(max-width:860px){
  .grid.g4,.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .subj-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:600px){
  .topbar{padding:10px 14px;gap:10px}
  .brand strong{font-size:13px}
  .brand small{display:none}
  .nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .nav a{flex:0 0 auto}
  .userbox{margin-left:auto}
  .userbox span{display:none}
  .wrap{padding:14px 12px 30px}
  .card{padding:15px}
  .grid.g2,.grid.g3,.grid.g4,.stat-grid,.hero-grid{grid-template-columns:1fr}
  .subj-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pagehead h1{font-size:19px}
  .auth-card{padding:24px 18px}
  .chartbox{height:270px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =====================================================================
   桂林市第三中学成绩管理系统 · 单文件纯前端版（增强版）
   数据全部保存在浏览器 LocalStorage（键前缀 hsgs_），无后端、无数据联网请求。
   角色：管理员 / 年级主任 / 教务处主任 / 学校领导 / 班主任 / 学生
   功能：年级与班级（支持按编号范围批量新增）、选科组合、选科年级排名与榜首姓名、分科满分、评语、
         公告（可设强制展示）、消息通知、学生职称与奖项、单科班级前十/年级前五十、
         成绩查看申请与班主任审批、学生端仅显示本人选科科目、班级管理人员查看、
         批量删除学生账号、管理人员联系方式与自定义信息、管理主页多维数据卡片、
         工作台实时时间与日期、考试预告（管理员发布批次与时间）、
         作弊记录（管理员认定 / 班主任反馈 / 年级主任接收 / 学生端醒目标注）
   代码分区：① 存储与常量 ② 通用工具 ③ 业务计算与权限 ④ 路由与框架
             ⑤ 页面渲染 ⑥ 批量导入 ⑦ 图表 ⑧ 启动与数据迁移
   ===================================================================== */

/* ---------- ① 存储与常量 ---------- */
const PREFIX='hsgs_';
const LS={
  get(k,def){ try{ const v=localStorage.getItem(PREFIX+k); return v===null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k,v){ localStorage.setItem(PREFIX+k,JSON.stringify(v)); },
  del(k){ localStorage.removeItem(PREFIX+k); }
};
// 注意：账号密码仅用于本地演示，LocalStorage 为明文存储，请勿使用真实敏感密码。
const DB={
  admin:         LS.get('admin',null),      // {username,password}
  staff:         LS.get('staff',[]),        // 管理人员 [{id,username,password,name,role,title,grade,classId,contact:{phone,email,office,remark,extra:[{key,value}]}}]
  students:      LS.get('students',[]),     // [{id,username,password,name,classId,combo,honors}]
  grades:        LS.get('grades',[]),       // ['高一','高二','高三'...]
  classes:       LS.get('classes',[]),      // [{id,name,grade}]
  scores:        LS.get('scores',[]),       // [{id,studentId,exam,date,scores,total,createdAt}]
  comments:      LS.get('comments',[]),     // [{id,studentId,authorId,authorName,authorRole,exam,date,content,createdAt}]
  announcements: LS.get('announcements',[]),// [{id,title,content,force,authorName,createdAt,updatedAt}]
  annRead:       LS.get('annRead',{}),      // { '用户id|公告id': 公告updatedAt } 强制公告已读记录
  messages:      LS.get('messages',[]),     // [{id,senderId,senderName,senderTitle,title,content,recipients,readBy,createdAt}]
  gradeRequests: LS.get('gradeRequests',[]),// 成绩查看申请 [{id,studentId,targetId,reason,status,createdAt,reviewedBy,reviewedAt,reply}]

/** 通用弹窗。opts:{title,body,okText,cancelText,hideOk,onOk(root),onOpen(root),width}
 *  onOk 返回 false 表示校验不通过、保持弹窗打开；返回其它值则关闭。 */
function openModal(opts){
  return new Promise(resolve=>{
    const root=$('modalRoot');
    root.innerHTML='<div class="mask"><div class="dialog" style="max-width:'+(opts.width||520)+'px">'+
      '<div class="dlg-head"><h3>'+esc(opts.title)+'</h3>'+
        (opts.noCancel?'':'<button class="x" data-m="cancel">×</button>')+'</div>'+
      '<div class="dlg-body">'+(opts.body||'')+'</div>'+
      '<div class="dlg-foot">'+
        (opts.hideOk?'':'<button class="btn primary" data-m="ok">'+esc(opts.okText||'确定')+'</button>')+
        (opts.noCancel?'':'<button class="btn ghost" data-m="cancel">'+esc(opts.cancelText||'取消')+'</button>')+
      '</div></div></div>';
    let done=false;
    const close=v=>{ if(done)return; done=true; root.innerHTML=''; resolve(v); };
    root.querySelectorAll('[data-m="cancel"]').forEach(b=>b.onclick=()=>close(false));
    root.querySelector('.mask').addEventListener('click',e=>{
      if(!opts.noCancel && e.target.classList.contains('mask'))close(false);
    });
    const okBtn=root.querySelector('[data-m="ok"]');
    if(okBtn) okBtn.onclick=async()=>{
      const r=opts.onOk?await opts.onOk(root):true;
      if(r!==false) close(r===undefined?true:r);
    };
    if(opts.onOpen) opts.onOpen(root);
  });
}

/* ---------- 自然排序（数字按数值比较，不再按字符串字典序） ----------
   解决「高一(10)班」被排到「高一(1)班」之后、「高一(9)班」之前的问题：
   字典序下 "10" < "2"，自然序下 2 < 9 < 10。
   同时兼容中文数字：高一 / 高二 / 高三、九班 / 十班 / 十一班 等。
   注意：中文数字按「单个字符」切段，避免「高三」+「九班」被误并成「三九」；
   「十」与紧随其后的个位合并为 10+n（十一→11），但不与其前面的年级数字合并，
   因此「高三十班」解析为 高三=3、十班=10，「高三十一班」解析为 3、11。 */
const CN_NUM={'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
/** 把字符串切成「数字段 / 文本段」序列，如「高一(10)班」→ 高 | 1 | ( | 10 | )班 */
function natParts(s){
  const str=String(s===undefined||s===null?'':s),raw=[];
  // 每个中文数字单独成段；阿拉伯数字串整体成段
  const re=/(\d+|[零〇一二两三四五六七八九十])/g;
  let last=0,m;
  while((m=re.exec(str))!==null){
    if(m.index>last) raw.push({num:false,v:str.slice(last,m.index)});
    raw.push({num:true,raw:m[0]});
    last=re.lastIndex;
  }
  if(last<str.length) raw.push({num:false,v:str.slice(last)});
  // 中文「十」+ 个位 → 10+n；其余中文数字与阿拉伯数字直接转成数值
  const parts=[];
  for(let i=0;i<raw.length;i++){
    const t=raw[i];
    if(!t.num){ parts.push(t); continue; }
    if(t.raw==='十'){
      const nx=raw[i+1];
      if(nx&&nx.num&&/^[一二两三四五六七八九]$/.test(nx.raw)){
        parts.push({num:true,v:10+CN_NUM[nx.raw]}); i++; continue;
      }
      parts.push({num:true,v:10}); continue;
    }
    parts.push({num:true,v:/^\d+$/.test(t.raw)?Number(t.raw):CN_NUM[t.raw]});
  }
  return parts;
}
/** 自然排序比较函数：数字段按数值，文本段按本地化文本比较 */
function naturalCompare(a,b){
  const A=natParts(a),B=natParts(b),n=Math.max(A.length,B.length);
  for(let i=0;i<n;i++){
    const x=A[i],y=B[i];
    if(!x) return -1;
    if(!y) return 1;
    if(x.num&&y.num){ if(x.v!==y.v) return x.v-y.v; continue; }
    if(x.num!==y.num) return x.num?-1:1;
    const c=x.v.localeCompare(y.v,'zh-CN');
    if(c) return c;
  }
  return 0;
}

function parseScore(raw,sub){
  const max=maxOf(sub);
  if(raw===''||raw===null||raw===undefined) return {ok:true,value:null};
  if(!/^\d+(\.\d+)?$/.test(raw)) return {ok:false,msg:'请输入数字（0~'+max+'）'};

  if(n<0||n>max) return {ok:false,msg:'分数需在 0~'+max+' 之间'};
  return {ok:true,value:n};
}

function firstNames(rec){
  const stu=stuOf(rec.studentId); if(!stu) return {grade:[],cls:[]};
  const g=gradeOf(stu), cn=comboName(stu), cid=classIdOf(stu);
  const batch=DB.scores.filter(r=>r.exam===rec.exam&&r.date===rec.date);
  const inCombo=r=>{ const s=stuOf(r.studentId); return s&&gradeOf(s)===g&&comboName(s)===cn; };
  const gp=batch.filter(inCombo);
  const gmax=gp.length?Math.max.apply(null,gp.map(r=>r.total)):null;
  const gnames=gmax===null?[]:[...new Set(gp.filter(r=>r.total===gmax).map(r=>(stuOf(r.studentId)||{}).name).filter(Boolean))];
  const cp=gp.filter(r=>classIdOf(stuOf(r.studentId)||{})===cid);
  const cmax=cp.length?Math.max.apply(null,cp.map(r=>r.total)):null;
  const cnames=cmax===null?[]:[...new Set(cp.filter(r=>r.total===cmax).map(r=>(stuOf(r.studentId)||{}).name).filter(Boolean))];
  return {grade:gnames,cls:cnames,combo:cn,gradeName:g};
}
/** 管理端排名：按批次 + 年级 + 选科组合，返回排序后的记录及榜首 */
function rankingData(exam,date,grade,combo){
  let list=DB.scores.filter(r=>r.exam===exam&&r.date===date);
  list=list.filter(r=>{ const s=stuOf(r.studentId); return s&&gradeOf(s)===grade&&(combo==='__all__'||comboName(s)===combo); });
  const best=new Map();
  list.forEach(r=>{ if(!best.has(r.studentId)||best.get(r.studentId).total<r.total) best.set(r.studentId,r); });
  const sorted=[...best.values()].sort((a,b)=>b.total-a.total);
  const rows=sorted.map((r,i)=>{
    const rank=i>0&&sorted[i-1].total===r.total?sorted.slice(0,i).findIndex(x=>x.total===r.total)+1:i+1;
    const s=stuOf(r.studentId)||{};
    return {rank,rec:r,stu:s,classId:classIdOf(s),className:classNameOf(s),combo:comboName(s)};
  });
  const top=rows.length?rows.filter(x=>x.rank===1).map(x=>x.stu.name).filter(Boolean):[];
  // 各班班级第一：按班级 ID 分组，避免不同年级同名班级被合并
  const byClass=new Map();
  rows.forEach(x=>{
    const k=x.classId||x.className;
    if(!byClass.has(k)||x.rec.total>byClass.get(k).rec.total) byClass.set(k,x);
  });
  return {rows,top,classFirsts:[...byClass.values()].sort((a,b)=>naturalCompare(a.className,b.className))};
}

  const list=DB.scores.filter(r=>r.exam===exam&&r.date===date&&
    classIdOf(stuOf(r.studentId)||{})===cid);
  return SUBJECTS.map(sub=>{
    const rows=list.filter(r=>typeof r.scores[sub]==='number');
    if(!rows.length) return {sub,max:null,firsts:[]};
    const max=Math.max.apply(null,rows.map(r=>r.scores[sub]));
    const seen=new Set(),firsts=[];
    rows.filter(r=>r.scores[sub]===max).forEach(r=>{
      const s=stuOf(r.studentId)||{};
      if(seen.has(s.id))return; seen.add(s.id);
      firsts.push({name:s.name||'-',combo:comboName(s),score:max});
    });
    return {sub,max,firsts};
  });
}

/** 某次考试单科：年级前五十 + 各班前十（并列同名次） */
function subjectTopData(exam,date,sub){
  const rows=DB.scores.filter(r=>r.exam===exam&&r.date===date&&typeof r.scores[sub]==='number')
    .map(r=>{
      const s=stuOf(r.studentId)||{};
      return {rec:r,stu:s,name:s.name||'-',classId:classIdOf(s),className:classNameOf(s),
        combo:comboName(s),score:r.scores[sub]};
    }).filter(x=>x.stu.id);
  const rankOf=(arr,i)=>i>0&&arr[i-1].score===arr[i].score
    ?arr.slice(0,i).findIndex(y=>y.score===arr[i].score)+1:i+1;
  const gs=rows.slice().sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  const gradeTop=gs.slice(0,50).map((x,i)=>Object.assign({},x,{rank:rankOf(gs,i)}));
  const byClass=new Map();
  rows.forEach(x=>{
    const k=x.classId||x.className;   // 按班级 ID 分组，不同年级同名班级互不合并
    if(!byClass.has(k))byClass.set(k,[]);
    byClass.get(k).push(x);
  });
  const classTop=[];
  [...byClass.values()].sort((a,b)=>naturalCompare(a[0].className,b[0].className)).forEach(list=>{
    const arr=list.slice().sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
    arr.slice(0,10).forEach((x,i)=>classTop.push(Object.assign({},x,{rank:rankOf(arr,i)})));
  });
  return {gradeTop,classTop,total:rows.length};
}

/* ---------- 实时时间与日期（所有角色工作台 + 导航栏，每秒刷新） ---------- */
const WEEK_CN=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function fmtClockTime(d){
  const p=n=>String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function fmtClockDate(d){
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+WEEK_CN[d.getDay()];
}
/** 工作台时钟卡片：大号时间 + 完整日期星期 + 下一场考试倒计时 */
function clockCardHtml(){
  return '<div class="clock-card"><div class="c-left">'+
    '<div class="c-time" data-clock-time>--:--:--</div>'+
    '<div class="c-date" data-clock-date>--</div></div>'+
    '<div class="c-right" data-clock-extra></div></div>';
}
/** 挂载后启动定时器：统一刷新导航栏小钟与工作台大钟；切换页面时先清旧定时器 */
function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  const tick=()=>{
    const d=new Date(),t=fmtClockTime(d),dt=fmtClockDate(d);
    document.querySelectorAll('[data-clock-time]').forEach(e=>e.textContent=t);
    document.querySelectorAll('[data-clock-date]').forEach(e=>e.textContent=dt);
    const nx=nextExamNotice();
    const extra=nx
      ? '📅 下一场考试：<b>'+esc(nx.exam)+'</b><br>'+esc(nx.date)+' '+esc(nx.startTime||'')+' · '+esc(examCountdownText(nx))
      : '📅 暂无考试预告';
    document.querySelectorAll('[data-clock-extra]').forEach(e=>e.innerHTML=extra);
  };
  tick();
  clockTimer=setInterval(tick,1000);
}

    (a.date||'').localeCompare(b.date||'')||(a.startTime||'').localeCompare(b.startTime||'')||a.createdAt-b.createdAt);

function examNoticeEnd(n){
  return new Date((n.date||'')+'T'+(n.endTime||n.startTime||'23:59')+':00');
}
function examCountdownText(n){
  const now=new Date();
  const start=new Date((n.date||'')+'T'+(n.startTime||'00:00')+':00');
  if(start>now) return '还有 '+Math.ceil((start-now)/86400000)+' 天';
  return examNoticeEnd(n)>now?'考试进行中':'已结束';
}

/** 读取并校验预告表单，返回 {ok,data,msg} */
function readExamNoticeForm(root){
  const q=s=>{ const e=root.querySelector(s); return e?String(e.value).trim():''; };
  const exam=q('#en-exam'),date=q('#en-date'),startTime=q('#en-start'),endTime=q('#en-end');
  const subjects=q('#en-subjects'),content=q('#en-content');
  if(!exam) return {ok:false,msg:'请输入考试名称 / 批次'};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return {ok:false,msg:'请选择考试日期'};
  if(startTime&&!/^\d{2}:\d{2}$/.test(startTime)) return {ok:false,msg:'开始时间格式不正确'};
  if(endTime&&!/^\d{2}:\d{2}$/.test(endTime)) return {ok:false,msg:'结束时间格式不正确'};
  if(startTime&&endTime&&endTime<=startTime) return {ok:false,msg:'结束时间需晚于开始时间'};
  return {ok:true,data:{exam,date,startTime,endTime,subjects,content}};
}

  const pending=DB.cheating.filter(c=>c.studentId===stuId&&c.exam===exam&&c.date===date&&c.status==='pending');
  return pending.length?'<span class="badge gold">待接收</span>':'';
}

function route(){
  chartInst&&(chartInst.destroy(),chartInst=null);
  let hash=location.hash||'#/login';
  // 1) 未初始化管理员：强制进入初始化页
  if(!DB.admin){
    if(hash!=='#/init'){ setHash('#/init'); return; }
    renderInit(); return;
  }
  // 2) 校验会话有效性（账号删除、管辖范围变更）
  validateSession();
  // 3) 已初始化：初始化页永久隐藏，手动输入该 hash 也直接回登录/首页
  if(hash==='#/init'){ setHash(session?homeHash():'#/login'); return; }
  const r=ROUTES[hash];
  if(!r){ render404(hash); return; }                          // 404 提示
  if(r.auth&&!session){ setHash('#/login'); toast('请先登录'); return; }
  if(r.auth&&session&&!r.auth.includes(session.role)){         // 越权访问拦截
    setHash(homeHash());
    toast('权限不足，已返回'+(session.role==='student'?'学生首页':'本角色首页'),'err');
    return;
  }
  if(hash==='#/login'&&session){ setHash(homeHash()); return; }
  r.render();
  // 登录后逐条弹出未读的强制公告（已读记录以用户+公告版本号为准）
  if(session&&hash!=='#/login') showForcedAnnouncements();
}
/** 校验登录态：账号被删除则强制下线；管理人员管辖范围变更时同步到会话 */
function validateSession(){
  if(!session) return;
  if(session.role==='leader'||session.role==='head'){
    const s=DB.staff.find(x=>x.id===session.id);
    if(!s||s.role!==session.role||s.username!==session.username){
      LS.del('session'); session=null; toast('该管理账号已不存在，请重新登录','err'); return;
    }
    session.name=s.name; session.classId=s.classId||null; session.grade=s.grade||'';
    session.title=staffTitle(s);
    saveSession();
  }else if(session.role==='student'){
    const s=DB.students.find(x=>x.id===session.id);
    if(!s){ LS.del('session'); session=null; toast('该学生账号已不存在，请重新登录','err'); return; }
    session.name=s.name; saveSession();
  }
}

      '<th>科目</th><th>满分</th><th>最高分</th><th>第一的同学（并列一并列出）</th></tr></thead><tbody>'+
      firsts.map(f=>'<tr><td><b>'+f.sub+'</b></td><td>'+maxOf(f.sub)+'</td>'+
        '<td>'+(f.max===null?'—':'<b>'+fmtNum(f.max)+'</b>')+'</td>'+
        '<td style="white-space:normal">'+(f.firsts.length
          ? f.firsts.map(x=>esc(x.name+'（'+x.combo+'） '+fmtNum(x.score)+' 分')).join('、')
          : '<span class="hint">未录入该科</span>')+'</td></tr>').join('')+
      '</tbody></table></div>';
    /* 三、班级第一 / 年级第一（受管理员开关约束） */
    const cls=DB.classes.find(x=>x.id===cid),grade=cls?cls.grade:NO_GRADE;
    const localTop=rep.filter(x=>x.rank===1).map(x=>x.stu.name).filter(Boolean);
    const d=combo?rankingData(exam,date,grade,combo):{top:[],classFirsts:[]};
    $('hr-first').innerHTML=
      '<div class="hero-grid">'+
        '<div class="hero"><div class="k">本班总分第一（不分选科）</div>'+
          '<div class="n">'+(localTop.length?esc(localTop.join('、')):'暂无')+'</div>'+
          '<div class="m">仅统计本班成绩，始终可见</div></div>'+
        '<div class="hero alt"><div class="k">'+esc((combo==='__all__'?'全部选科组合':combo||'—')+' · 年级第一')+'</div>'+
          '<div class="n">'+(d.top.length?esc(d.top.join('、')):'暂无')+'</div>'+
          '<div class="m">'+esc(grade+' ｜ '+exam+' · '+date)+' ｜ 只公示姓名</div></div>'+
      '</div>'+

        esc(combo==='__all__'?'全部选科组合':combo||'—')+'）：</p>'+
      (d.classFirsts.length
        ? '<p style="font-size:13px;line-height:1.9">'+d.classFirsts.map(x=>
            esc(x.className+'：'+x.stu.name)).join(' ｜ ')+'</p>'
        : '<div class="empty">该条件下暂无班级第一记录</div>');
  };
  b.onchange=refresh; c.onchange=refresh; refresh();
}

/* ----- 批量新增班级：按年级 + 名称模板 + 编号范围，一次生成任意数量班级 ----- */
const MAX_BATCH_CLASSES=200;   // 单次上限，防止误输入超大范围导致浏览器卡顿
/** 模板用 {n} 表示编号，例如「高一({n})班」+ 1~10 → 高一(1)班 … 高一(10)班 */
function openBatchClasses(){
  const grades=allGrades();
  if(!grades.length) return toast('请先新增年级','err');
  const defaultGrade=val('c-grade')||grades[0];
  const gradeOpts=grades.map(g=>'<option value="'+esc(g)+'"'+(g===defaultGrade?' selected':'')+'>'+esc(g)+'</option>').join('');
  const tpl0=defaultGrade+'({n})班';
  let result=null;
  openModal({
    title:'批量新增班级',width:560,okText:'一键生成',
    body:'<div class="grid g2">'+
      '<div class="field"><label>所属年级</label><select id="bc-grade">'+gradeOpts+'</select></div>'+
      '<div class="field"><label>名称模板（必须含 {n}）</label><input id="bc-tpl" value="'+esc(tpl0)+'" placeholder="如 高一({n})班"></div>'+
      '<div class="field"><label>起始编号</label><input id="bc-from" type="number" min="0" value="1"></div>'+
      '<div class="field"><label>结束编号</label><input id="bc-to" type="number" min="0" value="10"></div>'+
    '</div>'+
    '<div class="chk-line" style="margin-top:10px">'+
      '<span class="hint">快捷模板：</span>'+
      '<button type="button" class="btn ghost sm" data-tpl="__G__({n})班">年级({n})班</button>'+
      '<button type="button" class="btn ghost sm" data-tpl="({n})班">({n})班</button>'+
      '<button type="button" class="btn ghost sm" data-tpl="{n}班">{n}班</button>'+
    '</div>'+
    '<div id="bc-preview" class="total-box" style="margin-top:12px;font-size:13px"></div>'+
    '<div class="err" id="bc-err"></div>',
    onOpen(root){
      const q=s=>root.querySelector(s);
      const gradeEl=q('#bc-grade'),tplEl=q('#bc-tpl'),fromEl=q('#bc-from'),toEl=q('#bc-to');
      const preview=q('#bc-preview'),err=q('#bc-err');
      let lastGrade=defaultGrade;
      /** 解析当前表单：返回 {names:[{name,label}],err,from,to,grade,tpl} */
      const build=()=>{
        err.textContent='';
        const grade=gradeEl.value, tpl=tplEl.value.trim();
        const rawFrom=String(fromEl.value).trim(), rawTo=String(toEl.value).trim();
        if(!grade) return {err:'请选择所属年级'};
        if(!tpl) return {err:'请填写名称模板'};
        if(tpl.indexOf('{n}')<0) return {err:'名称模板必须包含 {n}（编号占位符）'};
        if(!/^\d+$/.test(rawFrom)||!/^\d+$/.test(rawTo)) return {err:'起始与结束编号需为非负整数'};
        const from=Number(rawFrom),to=Number(rawTo);
        if(from>to) return {err:'起始编号不能大于结束编号'};
        const count=to-from+1;
        if(count>MAX_BATCH_CLASSES) return {err:'单次最多 '+MAX_BATCH_CLASSES+' 个班级，请缩小范围或分批添加'};
        const names=[];
        for(let n=from;n<=to;n++) names.push({name:tpl.replace(/\{n\}/g,String(n)),label:''});
        names.forEach(x=>x.label=classLabel({name:x.name,grade}));
        return {names,from,to,grade,tpl,count};
      };
      const refresh=()=>{
        const b=build();
        if(b.err){ err.textContent=b.err; preview.innerHTML='<span>请修正上方输入后预览</span>'; return; }
        const labels=b.names.map(x=>x.label);
        const exists=labels.filter(l=>DB.classes.some(c=>classLabel(c)===l)).length;
        const head=labels.slice(0,3).join('、');
        const tail=labels.length>4?(' … '+labels[labels.length-1]):(labels.length===4?'、'+labels[3]:'');
        preview.innerHTML='<span>共 <b>'+b.count+'</b> 个：'+esc(head+tail)+
          (exists?'<br>其中 <b>'+exists+'</b> 个已存在，生成时自动跳过':'')+'</span>';
      };
      gradeEl.onchange=()=>{
        const g=gradeEl.value;
        // 模板仍为「旧年级({n})班」时，随年级切换自动替换年级前缀
        if(tplEl.value.trim()===lastGrade+'({n})班') tplEl.value=g+'({n})班';
        lastGrade=g; refresh();
      };
      [tplEl,fromEl,toEl].forEach(el=>{
        el.oninput=refresh; el.onchange=refresh;
      });
      root.querySelectorAll('[data-tpl]').forEach(btn=>btn.onclick=()=>{
        tplEl.value=btn.dataset.tpl.replace('__G__',gradeEl.value);
        refresh();
      });
      refresh();
    },
    onOk(root){
      const q=s=>root.querySelector(s);
      const gradeEl=q('#bc-grade'),tplEl=q('#bc-tpl'),fromEl=q('#bc-from'),toEl=q('#bc-to');
      const err=q('#bc-err');
      const grade=gradeEl.value, tpl=tplEl.value.trim();
      const rawFrom=String(fromEl.value).trim(), rawTo=String(toEl.value).trim();
      const fail=msg=>{ err.textContent=msg; return false; };
      if(!grade) return fail('请选择所属年级');
      if(!tpl||tpl.indexOf('{n}')<0) return fail('名称模板必须包含 {n}（编号占位符）');
      if(!/^\d+$/.test(rawFrom)||!/^\d+$/.test(rawTo)) return fail('起始与结束编号需为非负整数');
      const from=Number(rawFrom),to=Number(rawTo);
      if(from>to) return fail('起始编号不能大于结束编号');
      if(to-from+1>MAX_BATCH_CLASSES) return fail('单次最多 '+MAX_BATCH_CLASSES+' 个班级');
      const seen=new Set(DB.classes.map(classLabel));   // 唯一性 = 年级 + 名称，与单个新增一致
      const added=[],skipped=[];
      for(let n=from;n<=to;n++){
        const name=tpl.replace(/\{n\}/g,String(n));
        const label=classLabel({name,grade});
        if(seen.has(label)){ skipped.push(label); continue; }
        seen.add(label);
        DB.classes.push({id:uid(),name,grade});
        added.push(label);
      }
      save('classes');
      result={grade,added,skipped,from,to};
      renderOrg();   // 立即刷新班级列表与所有班级下拉
      return true;
    }
  }).then(ok=>{
    if(!ok||!result) return;
    const r=result;
    toast('已新增 '+r.added.length+' 个班级'+(r.skipped.length?'，跳过 '+r.skipped.length+' 个已存在':''),'ok');
    openModal({
      title:'批量新增结果',hideOk:true,cancelText:'关闭',width:520,
      body:'<p class="confirm-text">在 <b>'+esc(r.grade)+'</b> 下成功新增 <b>'+r.added.length+
        '</b> 个班级'+(r.skipped.length?'，跳过 <b>'+r.skipped.length+'</b> 个已存在班级':'，无重复')+'。</p>'+
        (r.added.length?'<pre class="log">'+esc('新增：\n'+r.added.join('\n'))+'</pre>':'')+
        (r.skipped.length?'<pre class="log">'+esc('已存在（跳过）：\n'+r.skipped.join('\n'))+'</pre>':'')
    });
  });
}

        const [newRole,newTitle]=root.querySelector('#sc-title').value.split('|');

        }

        save('staff'); toast('职务与管辖范围已更新','ok'); renderOrg(); return true;

    if(!ok) return;
    DB.staff=DB.staff.filter(x=>x.id!==s.id);
    save('staff'); toast('已删除管理人员账号','ok'); renderOrg();
  });
}

/* ----- 学生账号管理（admin 全部 / head 本班） ----- */
/** 删除一个或多个学生账号，并清理其成绩 / 评语 / 查看申请 / 消息收件人 */
function removeStudents(ids){
  const set=new Set(ids);
  DB.students=DB.students.filter(s=>!set.has(s.id));
  DB.scores=DB.scores.filter(r=>!set.has(r.studentId));
  DB.comments=DB.comments.filter(c=>!set.has(c.studentId));
  DB.cheating=DB.cheating.filter(c=>!set.has(c.studentId));
  DB.gradeRequests=DB.gradeRequests.filter(q=>!set.has(q.studentId)&&!set.has(q.targetId));
  DB.messages.forEach(m=>{
    m.recipients=(m.recipients||[]).filter(id=>!set.has(id));
    m.readBy=(m.readBy||[]).filter(id=>!set.has(id));
  });
  DB.messages=DB.messages.filter(m=>m.recipients.length);
  if(session&&session.role==='student'&&set.has(session.id)) LS.del('session');
  save('students');save('scores');save('comments');save('messages');save('gradeRequests');save('cheating');
}
function comboPickerHtml(){
  return '<div class="chk-line" id="combo-box">'+
    ELECTIVES.map(s=>'<label class="chk" data-sub="'+s+'"><input type="checkbox" value="'+s+'">'+s+'</label>').join('')+
    '</div><div class="chk-line" style="margin-top:8px">'+
      COMBO_PRESETS.map((p,i)=>'<button type="button" class="btn ghost sm" data-preset="'+i+'">'+
        comboName({combo:p})+'</button>').join('')+
      '<button type="button" class="btn ghost sm" id="combo-clear">清空选科</button></div>'+
    '<p class="hint" style="margin-top:6px">按新高考「六选三」填写，最多选 3 科；留空表示未选科。选科用于年级排名分组。</p>';
}
function bindComboPicker(root){
  const box=root.querySelector('#combo-box');
  const sync=()=>box.querySelectorAll('.chk').forEach(l=>
    l.classList.toggle('on',l.querySelector('input').checked));
  box.addEventListener('change',e=>{
    const checked=box.querySelectorAll('input:checked');
    if(checked.length>3){ e.target.checked=false; toast('选科最多 3 科','err'); }
    sync();
  });
  root.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
    const p=COMBO_PRESETS[Number(b.dataset.preset)];
    box.querySelectorAll('input').forEach(i=>i.checked=p.includes(i.value));
    sync();
  });
  root.querySelector('#combo-clear').onclick=()=>{
    box.querySelectorAll('input').forEach(i=>i.checked=false); sync();
  };
  sync();
}
function readCombo(root){
  return [...root.querySelectorAll('#combo-box input:checked')].map(i=>i.value);
}

  }).join('');

      '<div class="field"><label>考试日期</label><input type="date" id="'+p+'-date" value="'+esc(rec.date||today())+'"></div>'+

    '<div class="grid g3">'+subjFields+'</div>'+
    '<div class="err" id="'+p+'-err"></div>'+
    '<div class="total-box"><span>总分自动计算（语数英 150 + 选考 100 口径）</span><b id="'+p+'-total">0</b></div>';

function bindScoreForm(p){
  const update=()=>{
    let total=0,bad=[];
    SUBJECTS.forEach(sub=>{
      const el=$(p+'-s-'+sub), r=parseScore(el.value.trim(),sub);
      el.classList.toggle('invalid',!r.ok);
      if(r.ok&&r.value!==null) total+=r.value; else if(!r.ok) bad.push(sub+'('+r.msg+')');
    });
    $(p+'-total').textContent=fmtNum(total);
    $(p+'-err').textContent=bad.length?('分数不合法：'+bad.join('、')):'';
  };
  SUBJECTS.forEach(sub=>$(p+'-s-'+sub).addEventListener('input',update));
  const sel=$(p+'-exam'),custom=$(p+'-examCustom');
  const sync=()=>{ custom.style.display=sel.value==='自定义'?'block':'none'; };
  sel.addEventListener('change',sync); sync();
  // 按所选学生的选科组合提示可录科目，避免录进其他选科科目
  const syncCombo=()=>{
    const stu=stuOf(val(p+'-stu')), allowed=allowedSubjects(stu), hasCombo=comboName(stu)!=='未选科';
    SUBJECTS.forEach(sub=>{
      const el=$(p+'-s-'+sub);
      if(el) el.placeholder=allowed.includes(sub)
        ? '0~'+maxOf(sub)+'，留空为未考' : '该生未选此科，请留空';
    });
    const h=$(p+'-combo');
    if(h) h.textContent=hasCombo
      ? '该生选科：'+comboName(stu)+' ｜ 仅可录入语数英及选考科目（'+allowed.slice(3).join('、')+'）'
      : '该生暂未设置选科，建议先到「学生账号管理」设置选科';
  };
  $(p+'-stu').addEventListener('change',syncCombo);
  syncCombo(); update();
}
function collectScoreForm(p){
  const studentId=val(p+'-stu'),sel=val(p+'-exam');
  const exam=sel==='自定义'?val(p+'-examCustom'):sel;
  const date=val(p+'-date');
  const fail=m=>({ok:false,msg:m});
  if(!studentId) return fail('请选择学生');
  const s=stuOf(studentId);
  if(!s||!canEditStudent(s)) return fail('权限不足：只能管理本班学生');
  if(!exam) return fail('请填写考试名称');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return fail('请选择考试日期');
  const scores={};
  for(const sub of SUBJECTS){
    const r=parseScore($(p+'-s-'+sub).value.trim(),sub);
    if(!r.ok) return fail(sub+'：'+r.msg);
    if(r.value!==null) scores[sub]=r.value;
  }
  if(!Object.keys(scores).length) return fail('请至少录入一科分数');
  const allowed=allowedSubjects(s);
  const extra=SUBJECTS.filter(sub=>!allowed.includes(sub)&&typeof scores[sub]==='number');
  if(extra.length) return fail('该生选科为'+comboName(s)+'，不能录入非选科科目：'+extra.join('、')+'，请清空后再保存');
  return {ok:true,data:{studentId,exam,date,scores,total:totalOf(scores)}};
}

function filteredScores(){
  return DB.scores.filter(r=>{
    if(!visibleScore(r)) return false;
    const s=stuOf(r.studentId);
    if(scoreFilter.classId&&classIdOf(s)!==scoreFilter.classId) return false;
    if(scoreFilter.exam&&r.exam!==scoreFilter.exam) return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
}

      (readOnly?'':'<td><div class="ops"><button class="btn ghost sm" data-edit="'+esc(r.id)+'">编辑</button>'+
        (session.role==='admin'?'<button class="btn ghost sm" style="color:var(--danger)" data-scheat="'+esc(r.id)+'">标记作弊</button>':'')+
        '<button class="btn ghost sm" style="color:var(--danger)" data-delscore="'+esc(r.id)+'">删除</button></div></td>')+'</tr>';
  }).join('')||'<tr><td colspan="'+(readOnly?17:18)+'" class="empty">暂无成绩记录，请先录入或调整筛选条件</td></tr>';
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditScore(b.dataset.edit));
  document.querySelectorAll('[data-delscore]').forEach(b=>b.onclick=()=>delScore(b.dataset.delscore));
  document.querySelectorAll('[data-scheat]').forEach(b=>b.onclick=()=>toggleScoreCheat(b.dataset.scheat));
}
/** 成绩表格快捷「标记作弊」：管理员认定立即生效；再次点击可取消认定 */
async function toggleScoreCheat(recId){
  const rec=DB.scores.find(r=>r.id===recId); if(!rec) return;
  const mark=DB.cheating.find(c=>c.studentId===rec.studentId&&c.exam===rec.exam&&c.date===rec.date&&
    c.source==='admin'&&c.status==='confirmed');
  const s=stuOf(rec.studentId)||{};
  if(mark){
    const ok=await confirmDialog('取消作弊认定',
      '确定取消 <b>'+esc(s.name||'学生')+'</b> 在「'+esc(rec.exam+' · '+rec.date)+'」的作弊认定吗？','确认取消');
    if(!ok) return;
    DB.cheating=DB.cheating.filter(c=>c.id!==mark.id);
    save('cheating'); toast('已取消作弊认定','ok'); refreshScoreTable(); return;
  }
  openModal({
    title:'认定成绩作弊 · '+(s.name||'学生'),width:520,okText:'确认标记',
    body:'<p class="hint">考试：'+esc(rec.exam+' · '+rec.date)+' ｜ 总分：'+fmtNum(rec.total)+'</p>'+
      '<div class="field" style="margin-top:12px"><label>情况说明（必填）</label>'+
        '<textarea class="inp" id="sc-reason" placeholder="如：监考记录、违规情况说明"></textarea></div>'+
      '<div class="err" id="sc-err"></div>'+
      '<p class="hint">认定后立即生效，并在该学生账号下醒目显示。</p>',
    onOk(root){
      const reason=root.querySelector('#sc-reason').value.trim();
      if(!reason){ root.querySelector('#sc-err').textContent='请填写情况说明'; return false; }
      DB.cheating.push({id:uid(),studentId:rec.studentId,exam:rec.exam,date:rec.date,reason,
        source:'admin',status:'confirmed',reporterId:session.id,
        reporterName:session.name||session.username,reporterTitle:'管理员',
        receivedBy:null,receivedName:'',receivedAt:null,createdAt:Date.now()});
      save('cheating'); toast('已认定作弊并醒目标注','ok'); refreshScoreTable(); return true;
    }
  });
}
function openEditScore(id){
  const rec=DB.scores.find(r=>r.id===id); if(!rec)return;
  const s=stuOf(rec.studentId);
  if(!canEditStudent(s)) return toast('权限不足：只能修改本班成绩','err');
  openModal({
    title:'编辑成绩 · '+(s?s.name:''),
    body:scoreFieldsHtml('edit',rec),width:800,okText:'保存修改',
    onOpen(){ bindScoreForm('edit'); },
    onOk(){
      const r=collectScoreForm('edit');
      if(!r.ok){ toast(r.msg,'err'); return false; }
      if(findDup(r.data,rec.id)){ toast('同一学生本次考试已存在其它记录','err'); return false; }
      Object.assign(rec,r.data); save('scores'); toast('成绩已更新','ok'); renderAdminScores(); return true;
    }
  });
}
async function delScore(id){
  const rec=DB.scores.find(r=>r.id===id); if(!rec)return;
  const s=stuOf(rec.studentId);
  if(!canEditStudent(s)) return toast('权限不足','err');
  const ok=await confirmDialog('删除成绩',
    '确定删除 <b>'+esc(s?s.name:'已删除学生')+'</b> 的「'+esc(rec.exam)+' · '+esc(rec.date)+'」成绩吗？<br>总分 <b>'+fmtNum(rec.total)+'</b>，该次考试关联的作弊记录也会一并删除，操作不可恢复。','确认删除');
  if(!ok)return;
  DB.scores=DB.scores.filter(r=>r.id!==id);
  DB.cheating=DB.cheating.filter(c=>!(c.studentId===rec.studentId&&c.exam===rec.exam&&c.date===rec.date));
  save('scores');save('cheating'); toast('已删除成绩','ok'); renderAdminScores();
}

/* ----- 统计分析：单科平均分/最高分/最低分 + 班级总分排名 ----- */
function renderAdminStats(){
  // 班级下拉只列当前角色可见范围内的班级，value 用班级 ID（不同年级可同名），顺序统一用自然排序
  const visibleClassIds=new Set(visibleStudents().map(classIdOf));
  const classOpts=allClassesSorted().filter(c=>visibleClassIds.has(c.id)).map(c=>
    '<option value="'+esc(c.id)+'">'+esc(classLabel(c))+'</option>').join('');
  const examOpts='<option value="">全部考试</option>'+allExams().map(e=>'<option value="'+esc(e)+'">'+esc(e)+'</option>').join('');
  const batchOpts=allBatches().map(b=>'<option value="'+esc(b.exam+'|'+b.date)+'">'+esc(b.exam+' · '+b.date)+'</option>').join('')
    ||'<option value="">暂无考试批次</option>';
  const content=
    '<div class="card"><h2>单科统计 <span class="tag">平均分 / 最高分 / 最低分</span></h2>'+
      '<div class="grid g2" style="margin-bottom:14px">'+
        '<div class="field"><label>考试名称</label><select id="st-exam">'+examOpts+'</select></div>'+
        '<div class="field"><label>班级</label><select id="st-class"><option value="">全部班级（权限内）</option>'+classOpts+'</select></div>'+
      '</div><div id="st-result"></div></div>'+
    '<div class="card"><h2>班级总分排名</h2>'+
      '<div class="grid g2" style="margin-bottom:14px">'+
        '<div class="field"><label>考试批次</label><select id="rk-batch">'+batchOpts+'</select></div>'+
        '<div class="field"><label>班级</label><select id="rk-class">'+classOpts+'</select></div>'+
      '</div><div id="rk-result"></div></div>';
  mount(page('统计分析','首页 / 统计分析',content));
  const computeStats=()=>{
    const ex=val('st-exam'),cl=val('st-class');
    const list=DB.scores.filter(r=>{
      if(!visibleScore(r))return false;
      if(ex&&r.exam!==ex)return false;
      if(cl&&classIdOf(stuOf(r.studentId)||{})!==cl)return false;
      return true;
    });
    const rows=SUBJECTS.map(sub=>{
      const nums=list.map(r=>r.scores[sub]).filter(v=>typeof v==='number');
      if(!nums.length)return '<tr><td>'+sub+'</td><td colspan="4" class="hint">暂无数据</td></tr>';
      const avg=nums.reduce((a,b)=>a+b,0)/nums.length;
      return '<tr><td><b>'+sub+'</b>（满分'+maxOf(sub)+'）</td><td>'+fmtNum(avg)+'</td>'+
        '<td>'+fmtNum(Math.max.apply(null,nums))+'</td><td>'+fmtNum(Math.min.apply(null,nums))+'</td><td>'+nums.length+'</td></tr>';
    }).join('');
    $('st-result').innerHTML='<p class="hint" style="margin-bottom:10px">参与统计记录：'+list.length+' 条（仅统计已录科目）</p>'+
      '<div class="table-scroll"><table><thead><tr><th>科目</th><th>平均分</th><th>最高分</th><th>最低分</th><th>参考人数</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>';
  };
  const computeRank=()=>{
    const b=val('rk-batch'),cl=val('rk-class');
    if(!b||!cl){ $('rk-result').innerHTML='<div class="empty">请先录入成绩并选择考试批次与班级</div>'; return; }
    const [exam,date]=b.split('|');
    const list=DB.scores.filter(r=>r.exam===exam&&r.date===date&&visibleScore(r)&&
      classIdOf(stuOf(r.studentId)||{})===cl);
    const clLabel=classLabel(DB.classes.find(c=>c.id===cl)||null);
    if(!list.length){ $('rk-result').innerHTML='<div class="empty">该班级本次考试暂无可见成绩记录</div>'; return; }
    const best=new Map();
    list.forEach(r=>{ if(!best.has(r.studentId)||best.get(r.studentId).total<r.total)best.set(r.studentId,r); });
    const sorted=[...best.values()].sort((a,b2)=>b2.total-a.total);
    const rows=sorted.map((r,i)=>{
      const rank=i>0&&sorted[i-1].total===r.total?sorted.slice(0,i).findIndex(x=>x.total===r.total)+1:i+1;
      const s=stuOf(r.studentId)||{};
      return '<tr><td><b>第 '+rank+' 名</b></td><td>'+esc(s.name||'-')+'</td><td>'+esc(s.username||'-')+'</td>'+
        '<td>'+esc(comboName(s))+'</td><td><b>'+fmtNum(r.total)+'</b></td></tr>';
    }).join('');
    $('rk-result').innerHTML='<p class="hint" style="margin-bottom:10px">'+esc(exam+' · '+date+' · '+clLabel)+' ，共 '+sorted.length+' 人</p>'+
      '<div class="table-scroll"><table><thead><tr><th>名次</th><th>姓名</th><th>用户名</th><th>选科</th><th>总分</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  };
  $('st-exam').onchange=computeStats;$('st-class').onchange=computeStats;
  $('rk-batch').onchange=computeRank;$('rk-class').onchange=computeRank;
  computeStats();computeRank();
}

  document.querySelectorAll('[data-delcom]').forEach(b=>b.onclick=async()=>{

function canWriteComment(stu){
  if(!stu||!session)return false;
  if(session.role==='admin')return true;
  if(session.role==='head')return !!session.classId&&classIdOf(stu)===session.classId;
  if(session.role==='leader')return !session.grade||gradeOf(stu)===session.grade;
  return false;
}

      '<div class="table-scroll"><table><thead><tr><th>标题</th><th>类型</th><th>发布人</th><th>发布时间</th><th>内容</th><th>操作</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>':'';
  mount(page(canManage?'公告管理':'公告查看','首页 / '+(canManage?'公告管理':'公告查看'),form+announcementHtml()+table));
  if(!canManage) return;

  $('an-add').onclick=()=>{
    const t=val('an-title'),c=$('an-content').value.trim(),f=$('an-force').checked;
    if(!t) return $('an-err').textContent='请输入公告标题';
    if(!c) return $('an-err').textContent='请输入公告内容';
    $('an-err').textContent='';
    const now=Date.now();
    DB.announcements.push({id:uid(),title:t,content:c,force:f,
      authorId:session.id,authorName:session.name||session.username,createdAt:now,updatedAt:now});
    save('announcements'); toast(f?'强制公告已发布':'公告已发布','ok'); renderAnnouncements();
  };
  document.querySelectorAll('[data-anedit]').forEach(b=>b.onclick=()=>{
    const a=DB.announcements.find(x=>x.id===b.dataset.anedit); if(!a)return;
    openModal({
      title:'编辑公告 · '+a.title,width:600,okText:'保存修改',
      body:'<div class="field"><label>公告标题</label><input id="ae-title" value="'+esc(a.title)+'"></div>'+
        '<div class="field" style="margin-top:12px"><label>公告内容</label>'+
          '<textarea class="inp" id="ae-content">'+esc(a.content)+'</textarea></div>'+
        '<label class="chk" style="margin-top:12px"><input type="checkbox" id="ae-force"'+
          (a.force?' checked':'')+'> 强制展示</label>'+
        '<div class="err" id="ae-err"></div>',
      onOk(root){
        const t=root.querySelector('#ae-title').value.trim();
        const c=root.querySelector('#ae-content').value.trim();
        if(!t||!c){ root.querySelector('#ae-err').textContent='标题与内容均不能为空'; return false; }
        a.title=t; a.content=c; a.force=root.querySelector('#ae-force').checked;
        a.updatedAt=Date.now();   // 版本号变化 → 所有人重新变为未读
        save('announcements'); toast('公告已更新','ok'); renderAnnouncements(); return true;
      }
    });
  });
  document.querySelectorAll('[data-anforce]').forEach(b=>b.onclick=()=>{
    const a=DB.announcements.find(x=>x.id===b.dataset.anforce); if(!a)return;
    a.force=!a.force; a.updatedAt=Date.now();
    save('announcements'); toast(a.force?'已设为强制展示':'已取消强制展示','ok'); renderAnnouncements();
  });
  document.querySelectorAll('[data-andel]').forEach(b=>b.onclick=async()=>{
    const a=DB.announcements.find(x=>x.id===b.dataset.andel); if(!a)return;
    const ok=await confirmDialog('删除公告',
      '确定删除公告 <b>'+esc(a.title)+'</b> 吗？'+(a.force?'该公告为强制展示，删除后不再弹出。':'')+'操作不可恢复。','确认删除');
    if(!ok)return;
    DB.announcements=DB.announcements.filter(x=>x.id!==a.id);
    Object.keys(DB.annRead).forEach(k=>{ if(k.endsWith('|'+a.id))delete DB.annRead[k]; });
    save('announcements');save('annRead'); toast('已删除公告','ok'); renderAnnouncements();
  });
}

function renderExamNotices(){
  const canManage=session.role==='admin';
  const list=sortedExamNotices();

    const past=examNoticeEnd(n)<new Date();
    return '<tr><td>'+esc(n.date)+'</td><td>'+esc(n.startTime||'—')+(n.endTime?' ~ '+esc(n.endTime):'')+'</td>'+
      '<td><b>'+esc(n.exam)+'</b></td><td>'+esc(n.subjects||'—')+'</td>'+
      '<td style="white-space:normal;min-width:180px">'+esc(n.content||'—')+'</td>'+
      '<td>'+(past?'<span class="badge soft">已结束</span>':'<span class="badge admin">'+esc(examCountdownText(n))+'</span>')+'</td>'+
      '<td>'+esc(n.authorName||'管理员')+'</td>'+
      (canManage?'<td><div class="ops"><button class="btn ghost sm" data-enedit="'+esc(n.id)+'">编辑</button>'+
        '<button class="btn ghost sm" style="color:var(--danger)" data-endel="'+esc(n.id)+'">删除</button></div></td>':'')+
    '</tr>';
  }).join('')||'<tr><td colspan="'+(canManage?8:7)+'" class="empty">暂无考试预告，管理员可在上方发布</td></tr>';
  const form=canManage?
    '<div class="card"><h2>发布考试预告 <span class="tag">考试批次 + 日期 + 时间</span></h2>'+
      examNoticeFormHtml()+
      '<button class="btn primary" id="en-add">发布考试预告</button>'+
    '</div>':'';
  const content=form+
    '<div class="card"><h2>考试预告列表 <span class="tag">共 '+list.length+' 场'+
      (canManage?' · 可发布 / 编辑 / 删除':' · 只读查看')+'</span></h2>'+
      '<div class="table-scroll"><table><thead><tr><th>考试日期</th><th>时间</th><th>考试名称 / 批次</th>'+
      '<th>科目</th><th>备注</th><th>状态</th><th>发布人</th>'+(canManage?'<th>操作</th>':'')+'</tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
  mount(page(canManage?'考试预告管理':'考试预告','首页 / 考试预告',content));
  if(!canManage) return;

  $('en-add').onclick=()=>{
    const r=readExamNoticeForm(document);
    if(!r.ok) return $('en-err').textContent=r.msg;
    $('en-err').textContent='';
    const now=Date.now();
    DB.examNotices.push(Object.assign({id:uid(),authorName:session.name||session.username,
      createdAt:now,updatedAt:now},r.data));
    save('examNotices'); toast('考试预告已发布','ok'); renderExamNotices();
  };
  document.querySelectorAll('[data-enedit]').forEach(b=>b.onclick=()=>{
    const n=DB.examNotices.find(x=>x.id===b.dataset.enedit); if(!n)return;
    openModal({
      title:'编辑考试预告 · '+n.exam,width:600,okText:'保存修改',
      body:examNoticeFormHtml(n),
      onOk(root){
        const r=readExamNoticeForm(root);
        if(!r.ok){ root.querySelector('#en-err').textContent=r.msg; return false; }
        Object.assign(n,r.data,{updatedAt:Date.now()});
        save('examNotices'); toast('考试预告已更新','ok'); renderExamNotices(); return true;
      }
    });
  });
  document.querySelectorAll('[data-endel]').forEach(b=>b.onclick=async()=>{
    const n=DB.examNotices.find(x=>x.id===b.dataset.endel); if(!n)return;
    const ok=await confirmDialog('删除考试预告',
      '确定删除 <b>'+esc(n.exam)+'（'+esc(n.date)+'）</b> 的考试预告吗？操作不可恢复。','确认删除');
    if(!ok)return;
    DB.examNotices=DB.examNotices.filter(x=>x.id!==n.id);
    save('examNotices'); toast('已删除考试预告','ok'); renderExamNotices();
  });
}

/* ----- 作弊 / 违纪记录：管理员认定、班主任反馈、年级主任接收 ----- */
function renderCheating(){
  const canAdd=session.role==='admin'||session.role==='head';
  const canDelete=session.role==='admin';
  const stuOpts=visibleStudents().map(s=>'<option value="'+esc(s.id)+'">'+
    esc(s.name+'（'+s.username+' · '+classNameOf(s)+'）')+'</option>').join('');
  const batchOpts='<option value="">自定义考试名称与日期…</option>'+allBatches().map(b=>
    '<option value="'+esc(b.exam+'|'+b.date)+'">'+esc(b.exam+' · '+b.date)+'</option>').join('');
  const form=canAdd?
    '<div class="card"><h2>'+(session.role==='admin'?'认定学生成绩作弊':'反馈本班作弊行为')+
      ' <span class="tag">'+(session.role==='admin'?'记录立即生效并醒目标注':'提交后需年级主任接收确认')+'</span></h2>'+
      '<div class="grid g3">'+
        '<div class="field"><label>学生</label><select id="ch-stu">'+
          (stuOpts||'<option value="">暂无可见学生</option>')+'</select></div>'+
        '<div class="field"><label>关联考试批次（可选）</label><select id="ch-batch">'+batchOpts+'</select></div>'+
        '<div class="field"><label>考试名称</label><input id="ch-exam" placeholder="如 高一上期中考试"></div>'+
        '<div class="field"><label>考试日期</label><input id="ch-date" type="date" value="'+today()+'"></div>'+
      '</div>'+
      '<div class="field" style="margin-top:12px"><label>情况说明（必填）</label>'+
        '<textarea class="inp" id="ch-reason" placeholder="如：夹带资料、交头接耳，监考记录编号……"></textarea></div>'+
      '<div class="err" id="ch-err"></div>'+
      '<button class="btn primary" id="ch-add">'+(session.role==='admin'?'标记作弊并生效':'提交作弊反馈')+'</button>'+
    '</div>':'';
  const list=visibleCheating().slice().sort((a,b)=>
    (a.status==='pending'?0:1)-(b.status==='pending'?0:1)||(b.date||'').localeCompare(a.date||''));
  const rows=list.map(c=>{
    const s=stuOf(c.studentId)||{};
    const statusBadge=c.status==='confirmed'?'<span class="badge cheat">⚠ 已确认</span>':
      c.status==='pending'?'<span class="badge gold">待接收</span>':'<span class="badge soft">已驳回</span>';
    const ops=[];
    if(canReceiveCheat(c)){
      ops.push('<button class="btn primary sm" data-chreceive="'+esc(c.id)+'">接收确认</button>');
      ops.push('<button class="btn ghost sm" data-chreject="'+esc(c.id)+'">驳回</button>');
    }
    if(session.role==='head'&&c.source==='head'&&c.status==='pending'&&c.reporterId===session.id)
      ops.push('<button class="btn ghost sm" data-chwithdraw="'+esc(c.id)+'">撤回反馈</button>');
    if(canDelete) ops.push('<button class="btn ghost sm" style="color:var(--danger)" data-chdel="'+esc(c.id)+'">删除</button>');
    return '<tr><td><b>'+esc(s.name||'已删除学生')+'</b></td><td>'+esc(classNameOf(s))+'</td>'+
      '<td>'+esc(c.exam||'考试')+'</td><td>'+esc(c.date||'')+'</td>'+
      '<td>'+esc(c.source==='admin'?'管理员认定':'班主任反馈')+'</td><td>'+statusBadge+'</td>'+
      '<td style="white-space:normal;min-width:180px">'+esc(c.reason||'—')+'</td>'+
      '<td>'+esc((c.reporterTitle?c.reporterTitle+' ':'')+(c.reporterName||'—'))+'</td>'+
      '<td>'+esc(c.receivedName||'—')+'</td>'+
      '<td><div class="ops">'+(ops.length?ops.join(''):'—')+'</div></td></tr>';
  }).join('')||'<tr><td colspan="10" class="empty">暂无作弊 / 违纪记录</td></tr>';
  const content=form+
    '<div class="card"><h2>作弊 / 违纪记录 <span class="tag">共 '+list.length+' 条'+
      (pendingCheatingCount()?' · 待接收 '+pendingCheatingCount()+' 条':'')+'</span></h2>'+
      '<p class="hint" style="margin-bottom:10px">管理员可直接认定并生效；班主任反馈后需年级主任 / 教务处主任接收确认；'+
        '只有已确认的记录才会在学生账号下醒目显示。班主任只能反馈本班，年级主任只能接收本年级权限内的反馈。</p>'+
      '<div class="table-scroll"><table><thead><tr><th>学生</th><th>班级</th><th>考试</th><th>日期</th>'+
      '<th>来源</th><th>状态</th><th>情况说明</th><th>记录人</th><th>接收人</th><th>操作</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
  mount(page('作弊违纪记录','首页 / 作弊违纪记录',content));

  if(canAdd){
    $('ch-batch').onchange=e=>{
      const v=e.target.value;
      if(!v)return;
      const [exam,date]=v.split('|');
      $('ch-exam').value=exam; $('ch-date').value=date;
    };
    $('ch-add').onclick=()=>{
      const sid=val('ch-stu'),exam=val('ch-exam'),date=val('ch-date'),reason=$('ch-reason').value.trim();
      if(!sid) return $('ch-err').textContent='请选择学生';
      if(!exam) return $('ch-err').textContent='请填写考试名称或选择考试批次';
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return $('ch-err').textContent='请选择考试日期';
      if(!reason) return $('ch-err').textContent='请填写情况说明';
      const s=stuOf(sid);
      if(!s||!visibleStudents().some(x=>x.id===sid)) return $('ch-err').textContent='权限不足：只能操作本班 / 权限内学生';
      $('ch-err').textContent='';
      const isAdmin=session.role==='admin';
      DB.cheating.push({id:uid(),studentId:sid,exam,date,reason,
        source:isAdmin?'admin':'head',status:isAdmin?'confirmed':'pending',
        reporterId:session.id,reporterName:session.name||session.username,
        reporterTitle:isAdmin?'管理员':(session.title||'班主任'),
        receivedBy:null,receivedName:'',receivedAt:null,createdAt:Date.now()});
      save('cheating');
      toast(isAdmin?'已认定作弊，学生账号下将醒目标注':'作弊反馈已提交，等待年级主任接收','ok');
      renderCheating();
    };
  }
  document.querySelectorAll('[data-chreceive]').forEach(b=>b.onclick=async()=>{
    const c=DB.cheating.find(x=>x.id===b.dataset.chreceive); if(!c||!canReceiveCheat(c))return;
    const s=stuOf(c.studentId)||{};
    const ok=await confirmDialog('接收作弊反馈',
      '确认接收 <b>'+esc(s.name||'学生')+'</b> 在「'+esc(c.exam+' · '+c.date)+'」的作弊反馈吗？<br>'+
      '接收后该记录<b>立即生效</b>，并会在学生账号下醒目标注。','确认接收');
    if(!ok)return;
    c.status='confirmed'; c.receivedBy=session.id;
    c.receivedName=(session.title||ROLE_NAME[session.role]||'管理人员')+' '+(session.name||session.username);
    c.receivedAt=Date.now();
    save('cheating'); toast('已接收并确认作弊记录','ok'); renderCheating();
  });
  document.querySelectorAll('[data-chreject]').forEach(b=>b.onclick=async()=>{
    const c=DB.cheating.find(x=>x.id===b.dataset.chreject); if(!c||!canReceiveCheat(c))return;
    const ok=await confirmDialog('驳回作弊反馈',
      '确定驳回该条班主任作弊反馈吗？驳回后不会在学生账号下显示。','确认驳回');
    if(!ok)return;
    c.status='rejected'; c.receivedBy=session.id;
    c.receivedName=(session.title||ROLE_NAME[session.role]||'管理人员')+' '+(session.name||session.username);
    c.receivedAt=Date.now();
    save('cheating'); toast('已驳回作弊反馈','ok'); renderCheating();
  });
  document.querySelectorAll('[data-chwithdraw]').forEach(b=>b.onclick=async()=>{
    const c=DB.cheating.find(x=>x.id===b.dataset.chwithdraw); if(!c)return;
    const ok=await confirmDialog('撤回反馈','确定撤回本条作弊反馈吗？','确认撤回');
    if(!ok)return;
    DB.cheating=DB.cheating.filter(x=>x.id!==c.id);
    save('cheating'); toast('已撤回反馈','ok'); renderCheating();
  });
  document.querySelectorAll('[data-chdel]').forEach(b=>b.onclick=async()=>{
    const c=DB.cheating.find(x=>x.id===b.dataset.chdel); if(!c)return;
    const ok=await confirmDialog('删除作弊记录',
      '确定删除该条记录吗？删除后学生账号下的醒目标注也会消失。','确认删除');
    if(!ok)return;
    DB.cheating=DB.cheating.filter(x=>x.id!==c.id);
    save('cheating'); toast('已删除作弊记录','ok'); renderCheating();
  });
}

/* ----- 管理端：发送消息给学生 ----- */
function renderMessageSend(){
  const targets=messageTargets();
  const opts=(targets.length?'<option value="__all__">全体可见学生（'+targets.length+' 人）</option>':'')+
    targets.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name+'（'+s.username+' · '+classNameOf(s)+'）')+'</option>').join('');
  const sent=DB.messages.filter(m=>m.senderId===session.id).sort((a,b)=>b.createdAt-a.createdAt);
  const rows=sent.map(m=>
    '<tr><td><b>'+esc(m.title)+'</b></td><td>'+esc(m.content.length>40?m.content.slice(0,40)+'…':m.content)+'</td>'+
    '<td>'+(m.recipients||[]).length+'</td><td>'+(m.readBy||[]).length+'</td>'+
    '<td>'+esc(new Date(m.createdAt).toLocaleString())+'</td>'+
    '<td><button class="btn ghost sm" style="color:var(--danger)" data-msgdel="'+esc(m.id)+'">删除</button></td></tr>'
  ).join('')||'<tr><td colspan="6" class="empty">暂无发送记录</td></tr>';
  const content=
    '<div class="card"><h2>发送消息</h2>'+
      '<div class="grid g2">'+
        '<div class="field"><label>接收学生</label><select id="ms-target">'+opts+'</select></div>'+
        '<div class="field"><label>消息标题</label><input id="ms-title" placeholder="请输入标题"></div>'+
      '</div>'+
      '<div class="field" style="margin-top:12px"><label>消息内容</label>'+
        '<textarea class="inp" id="ms-content" placeholder="请输入消息内容"></textarea></div>'+
      '<div class="err" id="ms-err"></div>'+
      '<button class="btn primary" id="ms-send">发送消息</button></div>'+
    '<div class="card"><h2>已发送消息 <span class="tag">共 '+sent.length+' 条</span></h2>'+
      '<div class="table-scroll"><table><thead><tr><th>标题</th><th>内容</th><th>接收人数</th><th>已读人数</th><th>发送时间</th><th>操作</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
  mount(page('发送消息','首页 / 发送消息',content));
  $('ms-send').onclick=()=>{
    const target=val('ms-target'),t=val('ms-title'),c=$('ms-content').value.trim();
    if(!target||!targets.length) return $('ms-err').textContent='暂无可发送的学生';
    if(!t||!c) return $('ms-err').textContent='请填写标题与内容';
    $('ms-err').textContent='';
    const recipients=target==='__all__'?targets.map(s=>s.id):[target];
    DB.messages.push({id:uid(),senderId:session.id,senderName:session.name||session.username,
      senderTitle:session.title||ROLE_NAME[session.role]||'管理人员',
      title:t,content:c,recipients,readBy:[],createdAt:Date.now()});
    save('messages'); toast('消息已发送给 '+recipients.length+' 名学生','ok'); renderMessageSend();
  };
  document.querySelectorAll('[data-msgdel]').forEach(b=>b.onclick=async()=>{
    const ok=await confirmDialog('删除消息','确定删除该条已发送消息吗？学生端将不再显示，操作不可恢复。','确认删除');
    if(!ok)return;
    DB.messages=DB.messages.filter(m=>m.id!==b.dataset.msgdel);
    save('messages'); toast('已删除消息','ok'); renderMessageSend();
  });
}

      '<div class="err" id="ho-err"></div>'+
      '<div id="ho-list"></div></div>':'';
  const content=form+
    '<div class="card"><h2>'+(canEdit?'权限内全部记录':'职称与奖项（只读）')+
      ' <span class="tag">共 '+allRows.length+' 条'+(canEdit?'':' · 仅班主任可维护')+'</span></h2>'+
      '<div class="table-scroll"><table><thead><tr><th>学生</th><th>班级</th><th>职称</th><th>奖项</th><th>获得日期</th></tr></thead>'+
      '<tbody>'+table+'</tbody></table></div></div>';
  mount(page('职称与奖项','首页 / 职称与奖项',content));
  if(!canEdit) return;
  const refresh=()=>{
    const s=stuOf(val('ho-stu'));
    const list=s?honorsOf(s):[];
    $('ho-list').innerHTML='<h3>'+esc(s?s.name:'请选择学生')+' 的职称与奖项</h3>'+
      (list.length?'<div class="table-scroll"><table><thead><tr><th>职称</th><th>奖项</th><th>日期</th><th>操作</th></tr></thead><tbody>'+
        list.map(h=>'<tr><td>'+esc(h.title)+'</td><td>'+esc(h.award)+'</td><td>'+esc(h.date||'—')+'</td>'+
          '<td><button class="btn ghost sm" style="color:var(--danger)" data-hodel="'+esc(h.id)+'">删除</button></td></tr>').join('')+
        '</tbody></table></div>':'<div class="empty">暂无记录</div>');
    document.querySelectorAll('[data-hodel]').forEach(b=>b.onclick=async()=>{
      const stu=stuOf(val('ho-stu')); if(!stu||!canEditHonors(stu))return toast('权限不足','err');
      const ok=await confirmDialog('删除职称奖项','确定删除这条职称与奖项记录吗？操作不可恢复。','确认删除');
      if(!ok)return;
      stu.honors=honorsOf(stu).filter(h=>h.id!==b.dataset.hodel);
      save('students'); toast('已删除','ok'); refresh();
    });
  };
  $('ho-stu').onchange=refresh; refresh();
  $('ho-add').onclick=()=>{
    const s=stuOf(val('ho-stu')),t=val('ho-title'),a=val('ho-award'),d=val('ho-date');
    if(!s) return $('ho-err').textContent='请选择学生';

    save('students'); $('ho-title').value='';$('ho-award').value='';
    toast('已添加职称与奖项','ok'); renderHonors();
  };
}

/* ----- 单科榜单：班级前十 + 年级前五十 ----- */
function renderSubjectTop(){
  const batchOpts=allBatches().map(b=>
    '<option value="'+esc(b.exam+'|'+b.date)+'">'+esc(b.exam+' · '+b.date)+'</option>').join('')
    ||'<option value="">暂无考试批次</option>';
  const subjOpts=SUBJECTS.map(s=>'<option value="'+s+'">'+s+'（满分'+maxOf(s)+'）</option>').join('');
  const myClass=DB.classes.find(c=>c.id===session.classId);
  const limited=session.role==='head';   // 班主任只显示本班学生
  const content=
    '<div class="card"><h2>筛选条件</h2><div class="grid g2">'+
      '<div class="field"><label>考试批次</label><select id="sp-batch">'+batchOpts+'</select></div>'+
      '<div class="field"><label>科目</label><select id="sp-subj">'+subjOpts+'</select></div>'+
    '</div>'+(limited?'<p class="hint" style="margin-top:10px">仅显示本班学生'+(myClass?'（'+esc(classLabel(myClass))+'）':'')+'。</p>':'')+'</div>'+
    '<div class="card"><h2>各班班级前十</h2><div id="sp-class"></div></div>'+
    '<div class="card"><h2>年级前五十</h2><div id="sp-grade"></div></div>';
  mount(page('单科榜单','首页 / 单科榜单',content));
  const compute=()=>{
    const b=val('sp-batch'),sub=val('sp-subj');
    if(!b||!sub){ $('sp-class').innerHTML='<div class="empty">请先录入成绩</div>';$('sp-grade').innerHTML='<div class="empty">请先录入成绩</div>';return; }
    const [exam,date]=b.split('|');
    const d=subjectTopData(exam,date,sub);
    const mine=x=>!limited||(myClass&&x.classId===myClass.id);
    const cRows=d.classTop.filter(mine);
    const gRows=d.gradeTop.filter(mine);
    $('sp-class').innerHTML='<p class="hint" style="margin-bottom:9px">'+esc(exam+' · '+date+' · '+sub)+
      ' ｜ 共 '+d.total+' 条有效成绩</p>'+
      (cRows.length?'<div class="table-scroll"><table><thead><tr><th>班级</th><th>班级名次</th><th>姓名</th><th>选科</th><th>分数</th></tr></thead><tbody>'+
        cRows.map(x=>'<tr><td>'+esc(x.className)+'</td><td><b>第 '+x.rank+' 名</b></td><td>'+esc(x.name)+'</td>'+
          '<td>'+esc(x.combo)+'</td><td><b>'+fmtNum(x.score)+'</b></td></tr>').join('')+'</tbody></table></div>'
        :'<div class="empty">暂无数据</div>');
    $('sp-grade').innerHTML=(gRows.length
      ?'<div class="table-scroll"><table><thead><tr><th>年级名次</th><th>姓名</th><th>班级</th><th>选科</th><th>分数</th></tr></thead><tbody>'+
        gRows.map(x=>'<tr><td><b>第 '+x.rank+' 名</b></td><td>'+esc(x.name)+'</td><td>'+esc(x.className)+'</td>'+
          '<td>'+esc(x.combo)+'</td><td><b>'+fmtNum(x.score)+'</b></td></tr>').join('')+'</tbody></table></div>'
      :'<div class="empty">暂无数据</div>');
  };
  ['sp-batch','sp-subj'].forEach(id=>$(id).onchange=compute);
  compute();
}

/* ----- 管理端：成绩查看申请（仅班主任可审批） ----- */
function renderRequests(){
  const canReview=session.role==='head';
  const list=visibleGradeRequests();
  const rows=list.map(q=>{
    const a=stuOf(q.studentId)||{},t=stuOf(q.targetId)||{};
    const review=canReviewRequest(q);
    const ops=(canReview&&review&&q.status==='pending')
      ?'<button class="btn ghost sm" data-rqok="'+esc(q.id)+'">批准</button>'+
       '<button class="btn ghost sm" style="color:var(--danger)" data-rqno="'+esc(q.id)+'">拒绝</button>'
      :(canReview&&review&&q.status==='approved'
        ?'<button class="btn ghost sm" data-rqrevoke="'+esc(q.id)+'">撤销授权</button>':'—');
    return '<tr><td>'+esc(a.name||'-')+'</td><td>'+esc(t.name||'-')+'</td>'+
      '<td>'+esc(classNameOf(t))+'</td><td style="white-space:normal">'+esc(q.reason||'—')+'</td>'+
      '<td><span class="badge '+(q.status==='approved'?'gold':q.status==='pending'?'soft':'leader')+'">'+
        esc(REQ_STATUS[q.status]||q.status)+'</span></td>'+
      '<td>'+esc(q.reviewedBy?staffNameById(q.reviewedBy):'—')+'</td>'+
      '<td style="white-space:normal">'+esc(q.reply||'—')+'</td>'+
      '<td>'+esc(new Date(q.createdAt).toLocaleString())+'</td>'+
      '<td><div class="ops">'+ops+'</div></td></tr>';
  }).join('')||'<tr><td colspan="9" class="empty">暂无申请</td></tr>';
  const content='<div class="card"><h2>成绩查看申请'+
    (canReview?' <span class="tag">本班审批</span>':' <span class="tag">只读 · 仅班主任可审批</span>')+'</h2>'+
    '<div class="table-scroll"><table><thead><tr><th>申请人</th><th>目标学生</th><th>班级</th><th>申请理由</th>'+
    '<th>状态</th><th>审批人</th><th>回复</th><th>申请时间</th><th>操作</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div></div>';
  mount(page('成绩查看申请','首页 / 成绩查看申请',content));
  const saveAndRender=()=>{ save('gradeRequests'); renderRequests(); };
  document.querySelectorAll('[data-rqok]').forEach(b=>b.onclick=async()=>{
    const q=DB.gradeRequests.find(x=>x.id===b.dataset.rqok); if(!q||!canReviewRequest(q))return toast('权限不足','err');
    const ok=await confirmDialog('批准申请',
      '批准后 <b>'+esc((stuOf(q.studentId)||{}).name)+'</b> 可查看 <b>'+esc((stuOf(q.targetId)||{}).name)+
      '</b> 的考试成绩，确定批准吗？','确认批准');
    if(!ok)return;
    q.status='approved';q.reviewedBy=session.id;q.reviewedAt=Date.now();q.reply='批准';
    saveAndRender(); toast('申请已批准','ok');
  });
  document.querySelectorAll('[data-rqno]').forEach(b=>b.onclick=()=>{
    const q=DB.gradeRequests.find(x=>x.id===b.dataset.rqno); if(!q||!canReviewRequest(q))return toast('权限不足','err');
    openModal({
      title:'拒绝申请',width:460,okText:'确认拒绝',
      body:'<div class="field"><label>拒绝理由（可选）</label><input id="rq-reply" placeholder="如：请当面说明用途"></div>',
      onOk(root){
        q.status='rejected';q.reviewedBy=session.id;q.reviewedAt=Date.now();
        q.reply=root.querySelector('#rq-reply').value.trim()||'未批准';
        saveAndRender();toast('已拒绝申请','ok');return true;
      }
    });
  });
  document.querySelectorAll('[data-rqrevoke]').forEach(b=>b.onclick=async()=>{
    const q=DB.gradeRequests.find(x=>x.id===b.dataset.rqrevoke); if(!q||!canReviewRequest(q))return toast('权限不足','err');
    const ok=await confirmDialog('撤销授权','撤销后申请人将不再能查看该同学成绩，确定撤销吗？','确认撤销');
    if(!ok)return;
    q.status='revoked';q.reviewedBy=session.id;q.reviewedAt=Date.now();q.reply='授权已撤销';
    saveAndRender(); toast('已撤销授权','ok');
  });
}

      '</div><div class="err" id="sq-err"></div>'+
      '<button class="btn primary" id="sq-add">提交申请（由班主任审批）</button></div>'+

/** 已批准申请：只读查看本班同学成绩 */
function openPeerScores(targetId){
  if(!canViewPeer(session.id,targetId)) return toast('权限不足：该申请未获批准','err');
  const t=stuOf(targetId)||{};
  const recs=DB.scores.filter(r=>r.studentId===targetId)
    .sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const rows=recs.map(r=>{
    const rk=classRank(r);
    return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.exam)+'</td>'+
      SUBJECTS.map(s=>'<td>'+(typeof r.scores[s]==='number'?fmtNum(r.scores[s]):'—')+'</td>').join('')+
      '<td><b>'+fmtNum(r.total)+'</b></td><td>'+(rk?'第 '+rk.rank+' 名':'—')+'</td></tr>';
  }).join('')||'<tr><td colspan="13" class="empty">该同学暂无成绩记录</td></tr>';
  openModal({
    title:'同学成绩 · '+(t.name||''),width:900,hideOk:true,cancelText:'关闭',
    body:'<p class="hint" style="margin-bottom:10px">班级：'+esc(classNameOf(t))+
      ' ｜ 选科：'+esc(comboName(t))+' ｜ 仅可查看，不能修改</p>'+
      '<div class="table-scroll"><table><thead><tr><th>日期</th><th>考试</th>'+
      SUBJECTS.map(s=>'<th>'+s+'</th>').join('')+'<th>总分</th><th>班级排名</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>'
  });
}

function parseImportStudents(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const added=[],errors=[];
  lines.forEach((line,i)=>{
    if(/^(#|\/\/)/.test(line))return;
    const p=line.split(/[,，\t]/).map(s=>s.trim());
    if(i===0&&(p[0]==='用户名'||p[0].toLowerCase()==='username'))return;
    if(p.length<4){ errors.push('第'+(i+1)+'行：至少需要 4 列（用户名,密码,姓名,班级）'); return; }
    const [username,password,name,cname]=p;
    if(!username||!password){ errors.push('第'+(i+1)+'行：用户名或密码为空'); return; }
    if(DB.students.some(s=>s.username===username)||DB.staff.some(s=>s.username===username)||
       (DB.admin&&DB.admin.username===username)){
      errors.push('第'+(i+1)+'行：用户名 '+username+' 已存在，跳过'); return; }
    const found=findClassByText(cname);
    if(found.ambiguous.length){
      errors.push('第'+(i+1)+'行：班级「'+cname+'」在多个年级存在，请写成「'+classLabel(found.ambiguous[0])+'」形式以指定年级');
      return;
    }
    const cls=found.cls;
    if(!cls){ errors.push('第'+(i+1)+'行：找不到班级「'+cname+'」'); return; }
    if(session.role==='head'&&cls.id!==session.classId){ errors.push('第'+(i+1)+'行：班主任只能导入本班学生'); return; }
    const comboRaw=p[4]||'';
    const combo=comboRaw?comboRaw.split('|').map(s=>s.trim()).filter(Boolean):[];
    const badCombo=combo.find(x=>!ELECTIVES.includes(x));
    if(badCombo){ errors.push('第'+(i+1)+'行：未知选科「'+badCombo+'」'); return; }
    if(combo.length>3){ errors.push('第'+(i+1)+'行：选科最多 3 科'); return; }
    added.push({id:uid(),username,password,name:name||username,classId:cls.id,
      className:classLabel(cls),grade:cls.grade,combo,honors:[]});
  });
  DB.students.push(...added); save('students');
  return {added:added.length,errors};
}
